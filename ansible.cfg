[defaults]
host_key_checking = False
inventory = ./inventory/inventory.ini
remote_user = falak
private_key_file = ~/.ssh/id_ed25519
# Gather facts once per host per run, not once per play: later plays in the same
# run reuse the facts gathered earlier. Measured 2026-10-16 on the drift run
# (site.yml --check, 13 hosts): gather_facts 28.7 s -> 10.2 s.
gathering = smart

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=5 -o ServerAliveCountMax=3
# Run modules over the open SSH connection instead of copying each one first
# (needs sudo without requiretty: Ubuntu's default, proven on all 13 hosts).
# Measured 2026-10-16: the drift run 247 s -> 205 s with this alone, 191 s
# together with gathering = smart.
pipelining = True

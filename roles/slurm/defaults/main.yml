---
# defaults file for slurm (handbook Part 2, Ch18)

# MUNGE and Slurm need the same UID/GID on every node. Created before any package
# install, so neither munge's postinst nor anything else picks its own number.
slurm_munge_uid: 981
slurm_user_uid: 982

# The cluster's single MUNGE key: 128 random bytes, generated once on the controller
# (admin.beamline, ~/lab-ca/munge/munge.key, mode 400; backup on beamlinehost in
# ~/ca-backups/munge-key-2026-10). Read on the controller, outside Git.
slurm_munge_key_src: "{{ lookup('ansible.builtin.env', 'HOME') }}/lab-ca/munge/munge.key"

# Accounting database (step B): MariaDB on the controller only, reachable through its
# unix socket alone (skip-networking). The slurm DB user authenticates by unix_socket:
# only the OS user slurm (slurmdbd's User=) can log in, so slurmdbd.conf holds no password.
slurm_db_name: slurm_acct_db
slurm_db_user: slurm
slurm_db_socket: /run/mysqld/mysqld.sock
# SchedMD's accounting guide recommends a large buffer pool and a long lock wait timeout;
# the pool is sized for a 2.4 GiB VM that also runs slurmctld and slurmdbd.
slurm_db_innodb_buffer_pool_size: 256M
slurm_db_innodb_log_file_size: 64M
slurm_db_innodb_lock_wait_timeout: 900

# Shared directory (step C): exported by the controller (the only submit host), mounted
# on the compute nodes at the same path. NFSv4 only (one TCP port, 2049), served on the
# controller's lab address, reachable by the compute nodes only (ufw). AUTH_SYS: the
# server trusts the clients' UIDs, which are the same everywhere (falak 1000, slurm 982).
slurm_nfs_dir: /srv/hpc
slurm_nfs_users: [falak]
slurm_nfs_mount_opts: "rw,hard,noatime,_netdev,x-systemd.automount,x-systemd.mount-timeout=30"

# Slurm configuration (step D): written before any Slurm package is installed, because
# SchedMD's daemon packages start their service on install. Every parameter was checked
# against the man pages of our own 26.05.4 build (slurm.conf(5), cgroup.conf(5),
# slurmdbd.conf(5)).
slurm_cluster_name: beamline
slurm_ctld_port: 6817
slurm_slurmd_port: 6818
slurm_dbd_port: 6819
# srun listens in this range on whichever HPC node it runs on (hpc-ctl interactively, a
# compute node inside a batch job); slurmstepd and slurmctld connect back to it.
slurm_srun_port_range: "60001-60100"
slurm_state_save_dir: /var/spool/slurmctld
slurm_slurmd_spool_dir: /var/spool/slurmd
# Each compute node as it reports itself (lscpu, /proc/meminfo; 2026-10-11). RealMemory
# must not exceed the reported MemTotal (2479 / 4428 MiB, including the VM's virtio-mem
# 512 MiB), or the node is drained as invalid; MemSpecLimit keeps part of it for the OS
# and slurmd.
slurm_compute_nodes:
  hpc-c1.beamline: {sockets: 2, cores_per_socket: 1, threads_per_core: 1, real_memory: 2400, mem_spec_limit: 512}
  hpc-gpu.beamline: {sockets: 2, cores_per_socket: 1, threads_per_core: 1, real_memory: 4300, mem_spec_limit: 512}
slurm_partition_name: cpu
slurm_def_mem_per_cpu: 512
slurm_default_time: "00:30:00"
slurm_max_time: "04:00:00"

# Slurm packages and daemons (step E): our own build from the internal repository,
# installed at exactly this version and held, so an upgrade is always a deliberate step
# (slurmdbd first, then slurmctld, then slurmd).
slurm_version: "26.05.4-1"
slurm_packages_controller: [slurm-smd, slurm-smd-slurmdbd, slurm-smd-slurmctld, slurm-smd-client]
slurm_packages_compute: [slurm-smd, slurm-smd-slurmd, slurm-smd-client]
# Accounting: one account for the lab's users; a job needs an association.
slurm_acct_account: lab
slurm_acct_users: "{{ slurm_nfs_users }}"
# The mpi/pmix plugins dlopen libpmix.so.2 from /usr/lib/x86_64-linux-gnu/pmix2/lib at
# run time (read from the plugin binary); Ubuntu's runtime package ships exactly that.
slurm_pmix_package: libpmix2t64

# GPU scheduling (step H, Ch20). gres.conf on every HPC node; each GPU line names its node.
# AutoDetect=nvidia (plugin gpu/nvidia, no NVML library needed; this build has no gpu/nvml)
# finds the card; type and file are the sanity check: if they don't match what is detected,
# slurmd reports the node invalid and it is drained. The type must be a substring of the
# detected name (nvidia_geforce_gtx_750_ti, from slurmd -C on 2026-10-16).
slurm_gres_types: [gpu]
slurm_gpu_nodes:
  hpc-gpu.beamline: {type: gtx_750_ti, file: /dev/nvidia0, autodetect: nvidia}
# The default TRES can only be appended to; gres/gpu also adds gres/gpumem and gres/gpuutil.
slurm_accounting_tres: [gres/gpu]
# scontrol reboot runs this on an idle node (as slurmd, i.e. root). A node that doesn't come
# back within ResumeTimeout is marked DOWN; the default is 60 s, a drained reboot of hpc-gpu
# took about 36 s from drain to slurmd's re-registration (2026-10-16).
slurm_reboot_program: /usr/sbin/reboot
slurm_resume_timeout: 180

---
# Slurm cluster on hpc-ctl (controller, accounting) and hpc-c1/hpc-gpu (compute)
# (handbook Part 2, Ch18). Built up in steps, each with its own tag inside the play's
# 'slurm' tag: step A users and MUNGE (slurm_munge), step B the accounting database
# (slurm_db), step C the shared directory over NFS (slurm_nfs), step D the Slurm
# configuration, unit drop-ins and firewall (slurm_config), step E the packages,
# daemons and accounting objects (slurm_daemons).

- name: Refuse unless the MUNGE key exists on the controller (owner-only, at least 32 bytes)
  ansible.builtin.stat:
    path: "{{ slurm_munge_key_src }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  run_once: true
  register: slurm_munge_key_stat
  tags: [slurm_munge]

- name: Check the controller's MUNGE key
  ansible.builtin.assert:
    that:
      - slurm_munge_key_stat.stat.exists
      - slurm_munge_key_stat.stat.isreg
      - slurm_munge_key_stat.stat.size >= 32
      - slurm_munge_key_stat.stat.mode == '0400'
    fail_msg: "{{ slurm_munge_key_src }} must exist on the controller, mode 0400, at least 32 bytes"
    quiet: true
  run_once: true
  tags: [slurm_munge]

- name: Create the munge group with its fixed GID
  ansible.builtin.group:
    name: munge
    gid: "{{ slurm_munge_uid }}"
    system: true
  tags: [slurm_munge]

- name: Create the munge user with its fixed UID
  ansible.builtin.user:
    name: munge
    uid: "{{ slurm_munge_uid }}"
    group: munge
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  tags: [slurm_munge]

- name: Create the slurm group with its fixed GID
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_user_uid }}"
    system: true
  tags: [slurm_munge]

- name: Create the slurm user with its fixed UID
  ansible.builtin.user:
    name: slurm
    uid: "{{ slurm_user_uid }}"
    group: slurm
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  tags: [slurm_munge]

- name: Install MUNGE (Ubuntu archive)
  ansible.builtin.apt:
    name: munge
    update_cache: true
  tags: [slurm_munge]

- name: Install the cluster's MUNGE key (replaces the one the package generated)
  ansible.builtin.copy:
    src: "{{ slurm_munge_key_src }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  # In check mode munge (and its directory) isn't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Restart munge
  tags: [slurm_munge]

# munged loads its key at start: restart it now, before anything later in this play
# could talk to a daemon still holding the package's own key.
- name: Restart munge now if its key changed
  ansible.builtin.meta: flush_handlers
  tags: [slurm_munge]

- name: Enable and start munge
  ansible.builtin.systemd_service:
    name: munge
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm_munge]

# --- Step B: the accounting database (controller only) ---

- name: Install MariaDB and the Python driver the mysql modules need (controller only)
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Configure MariaDB for Slurm accounting (socket only, InnoDB settings)
  ansible.builtin.template:
    src: 60-slurm.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/60-slurm.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Restart MariaDB now if its configuration changed
  ansible.builtin.meta: flush_handlers
  tags: [slurm_db]

- name: Enable and start MariaDB
  ansible.builtin.systemd_service:
    name: mariadb
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Remove anonymous database accounts, if any
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ slurm_db_socket }}"
    column_case_sensitive: true
  # In check mode PyMySQL and the server aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Remove the test database, if any
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ slurm_db_socket }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Create the accounting database
  community.mysql.mysql_db:
    name: "{{ slurm_db_name }}"
    state: present
    login_unix_socket: "{{ slurm_db_socket }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Create the slurm database user, authenticated by unix_socket only (no password)
  community.mysql.mysql_user:
    name: "{{ slurm_db_user }}"
    host: localhost
    plugin: unix_socket
    priv: "{{ slurm_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ slurm_db_socket }}"
    column_case_sensitive: true
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

# --- Step C: the shared directory (NFSv4 from the controller to the compute nodes) ---

- name: Install the NFS server (controller only)
  ansible.builtin.apt:
    name: nfs-kernel-server
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

# rpc.mountd reads the same [nfsd] versions. With v2 and v3 off here and rpcbind masked
# below, it listened on no network port (checked 2026-10-10; the two changes were applied
# together, so their separate effects were not tested).
- name: Serve NFSv4 only (v2 and v3 off in nfsd and mountd)
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: "{{ item }}"
    value: "n"
    mode: "0644"
  loop: [vers2, vers3]
  notify: Restart nfs-server
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Serve NFS on the controller's lab address only
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: host
    value: "{{ ansible_host }}"
    mode: "0644"
  notify: Restart nfs-server
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Create the shared directory (controller)
  ansible.builtin.file:
    path: "{{ slurm_nfs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Create a private directory per cluster user in the share (controller)
  ansible.builtin.file:
    path: "{{ slurm_nfs_dir }}/{{ item }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0750"
  loop: "{{ slurm_nfs_users }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Make sure the exports drop-in directory exists (controller)
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Export the shared directory to the compute nodes only
  ansible.builtin.template:
    src: hpc.exports.j2
    dest: /etc/exports.d/hpc.exports
    owner: root
    group: root
    mode: "0644"
  notify: Re-export NFS shares
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Allow NFS (2049/tcp) from each compute node only
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] }}"
    comment: "NFS from {{ item }} (Ch18)"
  loop: "{{ groups['hpc_compute'] }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Enable and start the NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Apply NFS server changes now (restart, re-export)
  ansible.builtin.meta: flush_handlers
  tags: [slurm_nfs]

- name: Install the NFS client (compute nodes)
  ansible.builtin.apt:
    name: nfs-common
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_nfs]

- name: Mount the shared directory at the same path (compute nodes; automount, so a boot never waits for it)
  ansible.posix.mount:
    src: "{{ groups['hpc_controller'][0] }}:{{ slurm_nfs_dir }}"
    path: "{{ slurm_nfs_dir }}"
    fstype: nfs4
    opts: "{{ slurm_nfs_mount_opts }}"
    state: mounted
  # fstab changed: let systemd regenerate the mount and automount units.
  notify: Reload systemd units
  # In check mode the client tools aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_nfs]

# NFSv4 needs neither the portmapper nor NSM (statd); both come with the packages and
# listen on every address. Masked on server and clients (ufw drops them anyway).
- name: Stop and mask rpcbind and rpc-statd (not needed for NFSv4)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    masked: true
  loop: [rpcbind.socket, rpcbind.service, rpc-statd.service]
  # In check mode the NFS packages (and these units) aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm_nfs]

# --- Step D: Slurm configuration, in place before any Slurm package (their postinst
# enables and starts the daemons on install) ---

- name: Create the Slurm configuration directory
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [slurm_config]

- name: Install slurm.conf (identical on every HPC node)
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: root
    group: root
    mode: "0644"
  tags: [slurm_config]

- name: Install cgroup.conf (identical on every HPC node)
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: "0644"
  tags: [slurm_config]

- name: Install slurmdbd.conf (controller only; owner-only, holds no password)
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: "0600"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

- name: Create slurmctld's state directory (controller)
  ansible.builtin.file:
    path: "{{ slurm_state_save_dir }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0700"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

- name: Create slurmd's spool directory (compute nodes)
  ansible.builtin.file:
    path: "{{ slurm_slurmd_spool_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_config]

- name: Install the port-wait helper (controller)
  ansible.builtin.copy:
    src: beamline-wait-listen
    dest: /usr/local/sbin/beamline-wait-listen
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

- name: Create the drop-in directories for slurmdbd and slurmctld (controller)
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [slurmdbd, slurmctld]
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

# slurmdbd is Type=simple (active as soon as it forks) and slurmctld isn't ordered after
# it at all: on a cold boot slurmctld could start before slurmdbd accepts connections.
- name: Let slurmdbd report "started" only once it listens (controller)
  ansible.builtin.template:
    src: slurmdbd-wait-listen.conf.j2
    dest: /etc/systemd/system/slurmdbd.service.d/beamline-wait-listen.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd units
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

- name: Start slurmctld after slurmdbd (controller)
  ansible.builtin.template:
    src: slurmctld-after-slurmdbd.conf.j2
    dest: /etc/systemd/system/slurmctld.service.d/beamline-after-slurmdbd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd units
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

- name: Allow slurmctld (tcp) from each compute node (controller)
  community.general.ufw:
    rule: allow
    port: "{{ slurm_ctld_port }}"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] }}"
    comment: "slurmctld from {{ item }} (Ch18)"
  loop: "{{ groups['hpc_compute'] }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_config]

- name: Allow slurmd (tcp) from the other HPC nodes (compute nodes)
  community.general.ufw:
    rule: allow
    port: "{{ slurm_slurmd_port }}"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] }}"
    comment: "slurmd from {{ item }} (Ch18)"
  loop: "{{ groups['hpc'] | difference([inventory_hostname]) }}"
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_config]

- name: Allow srun's port range from the other HPC nodes (every HPC node)
  community.general.ufw:
    rule: allow
    port: "{{ slurm_srun_port_range | replace('-', ':') }}"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] }}"
    comment: "srun ports from {{ item }} (Ch18)"
  loop: "{{ groups['hpc'] | difference([inventory_hostname]) }}"
  tags: [slurm_config]

- name: Apply unit drop-in changes now
  ansible.builtin.meta: flush_handlers
  tags: [slurm_config]

# --- Step E: the Slurm packages and daemons. Each daemon package starts its daemon on
# install, so the order is the start order: slurmdbd, slurmctld, then slurmd ---

- name: Install slurmdbd (controller; its postinst starts it with the step-D configuration)
  ansible.builtin.apt:
    name:
      - "slurm-smd={{ slurm_version }}"
      - "slurm-smd-slurmdbd={{ slurm_version }}"
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_daemons]

- name: Install slurmctld and the client commands (controller)
  ansible.builtin.apt:
    name:
      - "slurm-smd-slurmctld={{ slurm_version }}"
      - "slurm-smd-client={{ slurm_version }}"
    install_recommends: false
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_daemons]

- name: Enable and start slurmdbd and slurmctld (controller)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [slurmdbd, slurmctld]
  # In check mode the packages (and these units) aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_daemons]

- name: Install slurmd and the client commands (compute nodes)
  ansible.builtin.apt:
    name:
      - "slurm-smd={{ slurm_version }}"
      - "slurm-smd-slurmd={{ slurm_version }}"
      - "slurm-smd-client={{ slurm_version }}"
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_daemons]

- name: Enable and start slurmd (compute nodes)
  ansible.builtin.systemd_service:
    name: slurmd
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_daemons]

- name: Hold the Slurm packages at the deployed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ slurm_packages_controller if inventory_hostname in groups['hpc_controller'] else slurm_packages_compute }}"
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm_daemons]

# Accounting objects. sacctmgr has no Ansible module: read first, add only what is missing.
- name: Read the clusters in the accounting database (controller)
  ansible.builtin.command:
    cmd: sacctmgr --noheader --parsable2 show cluster format=cluster
  register: slurm_acct_clusters
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_daemons]

- name: Register the cluster in the accounting database (controller)
  ansible.builtin.command:
    cmd: "sacctmgr --immediate add cluster {{ slurm_cluster_name }}"
  changed_when: true
  when:
    - inventory_hostname in groups['hpc_controller']
    - slurm_cluster_name not in (slurm_acct_clusters.stdout_lines | default([]))
  tags: [slurm_daemons]

- name: Read the accounts in the accounting database (controller)
  ansible.builtin.command:
    cmd: sacctmgr --noheader --parsable2 show account format=account
  register: slurm_acct_accounts
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_daemons]

- name: Create the lab's account (controller)
  ansible.builtin.command:
    cmd: >-
      sacctmgr --immediate add account {{ slurm_acct_account }}
      cluster={{ slurm_cluster_name }} description=beamline-lab-users organization=beamline
  changed_when: true
  when:
    - inventory_hostname in groups['hpc_controller']
    - slurm_acct_account not in (slurm_acct_accounts.stdout_lines | default([]))
  tags: [slurm_daemons]

- name: Read the users in the accounting database (controller)
  ansible.builtin.command:
    cmd: sacctmgr --noheader --parsable2 show user format=user
  register: slurm_acct_userlist
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_daemons]

- name: Add the lab's users to the account (controller)
  ansible.builtin.command:
    cmd: >-
      sacctmgr --immediate add user {{ item }}
      account={{ slurm_acct_account }} defaultaccount={{ slurm_acct_account }}
      cluster={{ slurm_cluster_name }}
  changed_when: true
  loop: "{{ slurm_acct_users }}"
  when:
    - inventory_hostname in groups['hpc_controller']
    - item not in (slurm_acct_userlist.stdout_lines | default([]))
  tags: [slurm_daemons]

---
# Slurm cluster on hpc-ctl (controller, accounting) and hpc-c1/hpc-gpu (compute)
# (handbook Part 2, Ch18). Built up in steps, each with its own tag inside the play's
# 'slurm' tag: step A users and MUNGE (slurm_munge), step B the accounting database
# (slurm_db).

- name: Refuse unless the MUNGE key exists on the controller (owner-only, at least 32 bytes)
  ansible.builtin.stat:
    path: "{{ slurm_munge_key_src }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  run_once: true
  register: slurm_munge_key_stat
  tags: [slurm_munge]

- name: Check the controller's MUNGE key
  ansible.builtin.assert:
    that:
      - slurm_munge_key_stat.stat.exists
      - slurm_munge_key_stat.stat.isreg
      - slurm_munge_key_stat.stat.size >= 32
      - slurm_munge_key_stat.stat.mode == '0400'
    fail_msg: "{{ slurm_munge_key_src }} must exist on the controller, mode 0400, at least 32 bytes"
    quiet: true
  run_once: true
  tags: [slurm_munge]

- name: Create the munge group with its fixed GID
  ansible.builtin.group:
    name: munge
    gid: "{{ slurm_munge_uid }}"
    system: true
  tags: [slurm_munge]

- name: Create the munge user with its fixed UID
  ansible.builtin.user:
    name: munge
    uid: "{{ slurm_munge_uid }}"
    group: munge
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  tags: [slurm_munge]

- name: Create the slurm group with its fixed GID
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_user_uid }}"
    system: true
  tags: [slurm_munge]

- name: Create the slurm user with its fixed UID
  ansible.builtin.user:
    name: slurm
    uid: "{{ slurm_user_uid }}"
    group: slurm
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  tags: [slurm_munge]

- name: Install MUNGE (Ubuntu archive)
  ansible.builtin.apt:
    name: munge
    update_cache: true
  tags: [slurm_munge]

- name: Install the cluster's MUNGE key (replaces the one the package generated)
  ansible.builtin.copy:
    src: "{{ slurm_munge_key_src }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  # In check mode munge (and its directory) isn't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Restart munge
  tags: [slurm_munge]

# munged loads its key at start: restart it now, before anything later in this play
# could talk to a daemon still holding the package's own key.
- name: Restart munge now if its key changed
  ansible.builtin.meta: flush_handlers
  tags: [slurm_munge]

- name: Enable and start munge
  ansible.builtin.systemd_service:
    name: munge
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm_munge]

# --- Step B: the accounting database (controller only) ---

- name: Install MariaDB and the Python driver the mysql modules need (controller only)
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Configure MariaDB for Slurm accounting (socket only, InnoDB settings)
  ansible.builtin.template:
    src: 60-slurm.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/60-slurm.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Restart MariaDB now if its configuration changed
  ansible.builtin.meta: flush_handlers
  tags: [slurm_db]

- name: Enable and start MariaDB
  ansible.builtin.systemd_service:
    name: mariadb
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Remove anonymous database accounts, if any
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ slurm_db_socket }}"
    column_case_sensitive: true
  # In check mode PyMySQL and the server aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Remove the test database, if any
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ slurm_db_socket }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Create the accounting database
  community.mysql.mysql_db:
    name: "{{ slurm_db_name }}"
    state: present
    login_unix_socket: "{{ slurm_db_socket }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Create the slurm database user, authenticated by unix_socket only (no password)
  community.mysql.mysql_user:
    name: "{{ slurm_db_user }}"
    host: localhost
    plugin: unix_socket
    priv: "{{ slurm_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ slurm_db_socket }}"
    column_case_sensitive: true
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

---
# Slurm cluster on hpc-ctl (controller, accounting) and hpc-c1/hpc-gpu (compute)
# (handbook Part 2, Ch18). Built up in steps, each with its own tag inside the play's
# 'slurm' tag: step A users and MUNGE (slurm_munge), step B the accounting database
# (slurm_db), step C the shared directory over NFS (slurm_nfs).

- name: Refuse unless the MUNGE key exists on the controller (owner-only, at least 32 bytes)
  ansible.builtin.stat:
    path: "{{ slurm_munge_key_src }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  run_once: true
  register: slurm_munge_key_stat
  tags: [slurm_munge]

- name: Check the controller's MUNGE key
  ansible.builtin.assert:
    that:
      - slurm_munge_key_stat.stat.exists
      - slurm_munge_key_stat.stat.isreg
      - slurm_munge_key_stat.stat.size >= 32
      - slurm_munge_key_stat.stat.mode == '0400'
    fail_msg: "{{ slurm_munge_key_src }} must exist on the controller, mode 0400, at least 32 bytes"
    quiet: true
  run_once: true
  tags: [slurm_munge]

- name: Create the munge group with its fixed GID
  ansible.builtin.group:
    name: munge
    gid: "{{ slurm_munge_uid }}"
    system: true
  tags: [slurm_munge]

- name: Create the munge user with its fixed UID
  ansible.builtin.user:
    name: munge
    uid: "{{ slurm_munge_uid }}"
    group: munge
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  tags: [slurm_munge]

- name: Create the slurm group with its fixed GID
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_user_uid }}"
    system: true
  tags: [slurm_munge]

- name: Create the slurm user with its fixed UID
  ansible.builtin.user:
    name: slurm
    uid: "{{ slurm_user_uid }}"
    group: slurm
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
  tags: [slurm_munge]

- name: Install MUNGE (Ubuntu archive)
  ansible.builtin.apt:
    name: munge
    update_cache: true
  tags: [slurm_munge]

- name: Install the cluster's MUNGE key (replaces the one the package generated)
  ansible.builtin.copy:
    src: "{{ slurm_munge_key_src }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  # In check mode munge (and its directory) isn't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  notify: Restart munge
  tags: [slurm_munge]

# munged loads its key at start: restart it now, before anything later in this play
# could talk to a daemon still holding the package's own key.
- name: Restart munge now if its key changed
  ansible.builtin.meta: flush_handlers
  tags: [slurm_munge]

- name: Enable and start munge
  ansible.builtin.systemd_service:
    name: munge
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm_munge]

# --- Step B: the accounting database (controller only) ---

- name: Install MariaDB and the Python driver the mysql modules need (controller only)
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Configure MariaDB for Slurm accounting (socket only, InnoDB settings)
  ansible.builtin.template:
    src: 60-slurm.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/60-slurm.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Restart MariaDB now if its configuration changed
  ansible.builtin.meta: flush_handlers
  tags: [slurm_db]

- name: Enable and start MariaDB
  ansible.builtin.systemd_service:
    name: mariadb
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Remove anonymous database accounts, if any
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ slurm_db_socket }}"
    column_case_sensitive: true
  # In check mode PyMySQL and the server aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Remove the test database, if any
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ slurm_db_socket }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Create the accounting database
  community.mysql.mysql_db:
    name: "{{ slurm_db_name }}"
    state: present
    login_unix_socket: "{{ slurm_db_socket }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

- name: Create the slurm database user, authenticated by unix_socket only (no password)
  community.mysql.mysql_user:
    name: "{{ slurm_db_user }}"
    host: localhost
    plugin: unix_socket
    priv: "{{ slurm_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ slurm_db_socket }}"
    column_case_sensitive: true
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_db]

# --- Step C: the shared directory (NFSv4 from the controller to the compute nodes) ---

- name: Install the NFS server (controller only)
  ansible.builtin.apt:
    name: nfs-kernel-server
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

# rpc.mountd reads the same [nfsd] versions. With v2 and v3 off here and rpcbind masked
# below, it listened on no network port (checked 2026-10-10; the two changes were applied
# together, so their separate effects were not tested).
- name: Serve NFSv4 only (v2 and v3 off in nfsd and mountd)
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: "{{ item }}"
    value: "n"
    mode: "0644"
  loop: [vers2, vers3]
  notify: Restart nfs-server
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Serve NFS on the controller's lab address only
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: host
    value: "{{ ansible_host }}"
    mode: "0644"
  notify: Restart nfs-server
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Create the shared directory (controller)
  ansible.builtin.file:
    path: "{{ slurm_nfs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Create a private directory per cluster user in the share (controller)
  ansible.builtin.file:
    path: "{{ slurm_nfs_dir }}/{{ item }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0750"
  loop: "{{ slurm_nfs_users }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Make sure the exports drop-in directory exists (controller)
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Export the shared directory to the compute nodes only
  ansible.builtin.template:
    src: hpc.exports.j2
    dest: /etc/exports.d/hpc.exports
    owner: root
    group: root
    mode: "0644"
  notify: Re-export NFS shares
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Allow NFS (2049/tcp) from each compute node only
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] }}"
    comment: "NFS from {{ item }} (Ch18)"
  loop: "{{ groups['hpc_compute'] }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Enable and start the NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_controller']
  tags: [slurm_nfs]

- name: Apply NFS server changes now (restart, re-export)
  ansible.builtin.meta: flush_handlers
  tags: [slurm_nfs]

- name: Install the NFS client (compute nodes)
  ansible.builtin.apt:
    name: nfs-common
    install_recommends: false
    update_cache: true
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_nfs]

- name: Mount the shared directory at the same path (compute nodes; automount, so a boot never waits for it)
  ansible.posix.mount:
    src: "{{ groups['hpc_controller'][0] }}:{{ slurm_nfs_dir }}"
    path: "{{ slurm_nfs_dir }}"
    fstype: nfs4
    opts: "{{ slurm_nfs_mount_opts }}"
    state: mounted
  # fstab changed: let systemd regenerate the mount and automount units.
  notify: Reload systemd units
  # In check mode the client tools aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: inventory_hostname in groups['hpc_compute']
  tags: [slurm_nfs]

# NFSv4 needs neither the portmapper nor NSM (statd); both come with the packages and
# listen on every address. Masked on server and clients (ufw drops them anyway).
- name: Stop and mask rpcbind and rpc-statd (not needed for NFSv4)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    masked: true
  loop: [rpcbind.socket, rpcbind.service, rpc-statd.service]
  # In check mode the NFS packages (and these units) aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [slurm_nfs]

---
# defaults file for tango_ds (handbook Part 3, Ch23)

# apt: the Tango client side (no tango-db here: that is roles/tango_db), the simulators'
# serial link (socat), and the debugging tools of Sept 2026 (gdb, python3-dbg, moreutils).
# No C++ toolchain and no podman any more (Ch23), and no Redis: the last device that used it
# dropped it in Ch27 (HDB++ is the archive from Ch30).
tango_ds_apt_packages:
  - tango-common
  - libtango-tools
  - python3-pip
  - socat
  - gdb
  - python3-dbg
  - moreutils

# pip, system-wide, the same pins as tango-devices' ci/Dockerfile (the versions Ch2-7 were
# tested with). Change a version here and in ci/Dockerfile together, in one commit.
# numpy comes with pytango. sardana (Ch31) brings its own dependencies unpinned, as in
# ci/Dockerfile: taurus 5.4.1, lxml, Pint, flexcache, flexparser, platformdirs (2026-10-25).
tango_ds_pip_packages:
  - pytango==10.3.1
  - pymodbus==3.15.0
  - pyserial==3.5
  - pytest==9.1.1
  - ruff==0.16.5
  - py-spy==0.4.2
  - sardana==3.7.0

# Removed from hosts that still have them (Ch27). Purged, so the service, its configuration
# and /var/lib/redis go too. The libraries redis-server pulled in (libatomic1, libjemalloc2,
# liblzf1) are left in place as unused automatic packages: purging them by name could remove
# a package added here later that needs them, and apt autoremove would act on whatever else
# happens to be unused on the host.
tango_ds_apt_packages_absent:
  - redis-server
  - redis-tools
tango_ds_pip_packages_absent:
  - redis

tango_ds_tango_host: tango-db.beamline:10000

# Jive (Tango's Java database browser) from conda-forge, in its own environment under a
# pinned Miniforge. The checksum is the one the release publishes for this installer
# (checked 2026-10-19). Jive 7.46 is what Sept 2026 used; 8.0 exists.
tango_ds_miniforge_version: 26.7.2-0
tango_ds_miniforge_sha256: 281b0ac7d550802efc81af633225a5e6116d29ae72f3ab4eae7168c3931a4c05
tango_ds_miniforge_prefix: /opt/miniforge3
tango_ds_miniforge_installer: "Miniforge3-{{ tango_ds_miniforge_version }}-Linux-x86_64.sh"
tango_ds_miniforge_url: >-
  https://github.com/conda-forge/miniforge/releases/download/{{ tango_ds_miniforge_version }}/{{ tango_ds_miniforge_installer }}
tango_ds_jive_env: tango-gui
tango_ds_jive_version: "7.46"

# --- Ch29: the device servers -----------------------------------------------------------
# One entry per device server, used twice:
# - registration (files/tango-ds-register): server, class, device and the listed
#   properties are written wherever the Tango database differs. Unlisted properties and
#   memorized attribute values (the magnet's setpoint, the vacuum gauge's PumpStatus) are
#   left alone. Property values are strings, as the database stores them.
# - a systemd unit, tango-<name>.service (templates/tango-ds-unit.service.j2): the script
#   under tango_ds_code_dir, three fixed ports, and the simulator units it starts after.
# Ports: CORBA (-ORBendPoint), ZeroMQ heartbeat and ZeroMQ event (TANGO_ZMQ_*_PORT); each
# kind is one contiguous block, opened in ufw as a range (asserted in the tasks). 28366 and
# 28367 stay free for Sardana's Pool and MacroServer (Ch31). All bind to the server's lab
# address only (they follow -ORBendPoint's host), below the kernel's ephemeral range.
# after: simulator units started first (Wants= + After=). The Faraday cup, vacuum gauge
# and interlock heal by themselves when theirs returns (Ch26-28), the camera since Ch29;
# the magnet after a lost PSU process is untested. binds_to: the magnet only - a socat
# restart makes new ptys, and the device reopens its port only at start (BindsTo=, so it
# restarts with socat).
tango_ds_servers:
  - name: magnet
    server: magnet_power_supply/q1
    class: MagnetPowerSupply
    device: linac/magnet/q1
    script: linac/magnet/magnet_power_supply.py
    ports: {corba: 28368, heartbeat: 28468, event: 28568}
    after: [magnet-psu]
    binds_to: magnet-socat
    properties:
      port: /run/tango-magnet/dev
      baudrate: "9600"
      ramp_rate: "5.0"
  - name: faradaycup
    server: faraday_cup/faradaycup1
    class: FaradayCup
    device: linac/beam/faradaycup1
    script: linac/beam/faraday_cup.py
    ports: {corba: 28369, heartbeat: 28469, event: 28569}
    after: [faradaycup-adapter]
    properties:
      PrologixHost: 127.0.0.1
      PrologixPort: "1234"
      GpibAddress: "22"
      PollIntervalMs: "500"
  - name: camera
    server: ceyag_camera/ceyag1
    class: CeYagCamera
    device: linac/camera/ceyag1
    script: linac/camera/ceyag_camera.py
    ports: {corba: 28370, heartbeat: 28470, event: 28570}
    after: [camera-sim]
    properties:
      host: 127.0.0.1
      port: "9999"
      frame_interval_ms: "200"
  - name: vacuum
    server: vacuum_gauge/gauge1
    class: VacuumGauge
    device: linac/vacuum/gauge1
    script: linac/vacuum/vacuum_gauge.py
    ports: {corba: 28371, heartbeat: 28471, event: 28571}
    after: [vacuum-sim]
    properties:
      Host: 127.0.0.1
      Port: "5020"
      ModbusDeviceId: "1"
  - name: interlock
    server: interlock_monitor/interlock1
    class: InterlockMonitor
    device: linac/safety/interlock1
    script: linac/safety/interlock_monitor.py
    ports: {corba: 28372, heartbeat: 28472, event: 28572}
    after: [interlock-sim]
    properties:
      Host: 127.0.0.1
      Port: "5040"

# The simulators: one unit each, tango-<name>.service, on 127.0.0.1 or ptys only (never
# opened in ufw). ready: tango-ds-wait's arguments, run as ExecStartPost= so a unit counts
# as started only once it can serve ($MAINPID is expanded by systemd). The adapter dials
# the picoammeter once at startup, so it starts after it; later restarts of either need
# nothing restarted (Ch26).
tango_ds_simulators:
  - name: magnet-socat
    description: RS-232 link for the magnet, a socat pty pair
    command: >-
      /usr/bin/socat -d pty,raw,echo=0,link=/run/tango-magnet/psu
      pty,raw,echo=0,link=/run/tango-magnet/dev
    runtime_dir: tango-magnet
    ready: path /run/tango-magnet/psu /run/tango-magnet/dev
  - name: magnet-psu
    description: Fake magnet power supply, on the instrument end of the link
    script: linac/magnet/fake_magnet_psu.py
    args: /run/tango-magnet/psu
    binds_to: magnet-socat
    ready: fd $MAINPID /run/tango-magnet/psu
  - name: faradaycup-picoammeter
    description: Fake Keithley 6485 picoammeter
    script: linac/beam/fake_picoammeter.py
    args: "5025"
    ready: listen 5025
  - name: faradaycup-adapter
    description: Fake Prologix GPIB-ETHERNET adapter in front of the picoammeter
    script: linac/beam/fake_prologix_adapter.py
    args: 1234 127.0.0.1 5025
    after: [faradaycup-picoammeter]
    ready: listen 1234
  - name: camera-sim
    description: Fake Ce:YAG camera, a frame every 0.5 s
    script: linac/camera/fake_ceyag_camera.py
    args: 9999 0.5
    ready: listen 9999
  - name: vacuum-sim
    description: Fake Modbus TCP vacuum gauge
    script: linac/vacuum/fake_modbus_vacuum.py
    args: "5020"
    ready: listen 5020
  - name: interlock-sim
    description: Fake Modbus TCP interlock PLC
    script: linac/safety/fake_modbus_plc.py
    args: "5040"
    ready: listen 5040

tango_ds_service_user: tango
tango_ds_code_dir: /opt/tango-devices
# -ORBendPoint's host: the servers bind to this name's lab address and publish it.
tango_ds_endpoint_host: "{{ inventory_hostname }}"
# Tango's console log level for the servers (4 = info): the devices' own error_stream
# and info_stream lines reach the journal (Ch29 probe L1). Python logging (the Faraday
# cup) goes to stderr regardless.
tango_ds_log_level: 4
tango_ds_allowed_from: 10.10.10.0/24
# Restart delay: at most two starts per 10 s, so systemd's default start limit (5 in 10 s)
# never stops a unit that keeps failing while its peer is missing.
tango_ds_restart_sec: 5

# --- Ch31: Sardana's servers -------------------------------------------------------------
# One entry per Sardana server, each with its devices, named as Sardana's own registration
# (register_sardana() in sardana/tango/core/util.py, 3.7.0) would name them, which are the
# names the September elements and tests use. files/tango-ds-register writes them like
# tango_ds_servers; a server whose instance is registered never asks its interactive
# "does not exist" and "select the Pool" questions, which a unit can't answer.
# - Pool: PoolPath is where it looks for controller modules. It imports every .py file
#   there at every start, so a module with top-level code runs then (Ch7's lab72_proof.py).
# - MacroServer: PoolNames connects it to the Pool. EnvironmentDb "property:<object>" keeps
#   its environment (ActiveMntGrp, ...) as free properties of that Tango DB object, so its
#   unit needs no writable path. Given a path it can't write, init_device() replaces this
#   property with a mkdtemp() path in the database; the role would show that as drift.
# Ports continue tango_ds_servers' blocks just below them (..66 Pool, ..67 MacroServer).
# ports, exec and after are for the units and their ufw rules (Ch31).
tango_ds_sardana_servers:
  - name: pool
    server: Pool/linac
    exec: /usr/local/bin/Pool
    ports: {corba: 28366, heartbeat: 28466, event: 28566}
    after: [magnet, faradaycup]
    devices:
      - class: Pool
        device: pool/linac/1
        alias: Pool_linac_1
        properties:
          PoolPath: [/opt/tango-devices/sardana_controllers]
  - name: macroserver
    server: MacroServer/linac
    exec: /usr/local/bin/MacroServer
    ports: {corba: 28367, heartbeat: 28467, event: 28567}
    after: [pool]
    devices:
      - class: MacroServer
        device: macroserver/linac/1
        alias: MS_linac_1
        properties:
          PoolNames: [Pool_linac_1]
          EnvironmentDb: property:SardanaEnv_linac
      - class: Door
        device: door/linac/1
        alias: Door_linac_1
# Console level of Sardana's servers, all of which goes to the journal (Ch31): info shows
# the controller and macro modules each server loads at start; warning would hide them.
tango_ds_sardana_log_level: info

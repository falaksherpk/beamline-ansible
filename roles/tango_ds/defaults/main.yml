---
# defaults file for tango_ds (handbook Part 3, Ch23; Part 4, Ch35)

# apt: the Tango client side (no tango-db here: that is roles/tango_db), the simulators'
# serial link (socat), and the debugging tools of Sept 2026 (gdb, python3-dbg, moreutils).
# No C++ toolchain and no podman any more (Ch23), and no Redis: the last device that used it
# dropped it in Ch27 (HDB++ is the archive from Ch30). No pip either since Ch35: the device
# servers and their Python runtime come as Debian packages (below).
tango_ds_apt_packages:
  - tango-common
  - libtango-tools
  - socat
  - gdb
  - python3-dbg
  - moreutils

# --- Ch35: the device servers from the lab's apt repository -----------------------------
# beamline-tango-devices carries the servers, the Sardana controllers and their runtime, a
# hash-locked venv in tango_ds_runtime (PyTango, pymodbus, Sardana); -simulators the seven
# fakes. Both are released together by tango-devices' tag pipeline (Part 4, Ch34) and held
# here at this version, so only this role moves them: a new release is a change of this
# value, after which the role restarts every instance (the venv changes under them).
# Rollback is the same change back, with the previous release's .debs (Ch35's procedure).
tango_ds_package_version: 1.0.0
tango_ds_packages:
  - beamline-tango-devices
  - beamline-tango-simulators
# The package's runtime. The role's own scripts (files/), which import PyTango, name its
# interpreter in their first line: change both together.
tango_ds_runtime: /opt/beamline-tango
# Site data for the package's template units: /etc/beamline-tango/%p-%i.env, written by
# this role before an instance is enabled (systemd-analyze verify doesn't notice a
# missing one, Ch33; the instance would fail only at start).
tango_ds_env_dir: /etc/beamline-tango

# Removed from hosts that still have them. Purged, so the service, its configuration and
# /var/lib/redis go too (Ch27). python3-pip went with the system pip tree (Ch35). The
# libraries these had pulled in are left in place as unused automatic packages: purging
# them by name could remove a package added here later that needs them, and apt
# autoremove would act on whatever else happens to be unused on the host.
tango_ds_apt_packages_absent:
  - redis-server
  - redis-tools
tango_ds_apt_packages_absent_after_pip:
  - python3-pip

# --- Ch35: what the package replaced, removed once -------------------------------------
# Part 3's layout (Ch23-32): the device code in a checkout, PyTango and Sardana in the
# system Python's pip tree, one role-rendered unit per process. The role removes each of
# these where it finds it and finds nothing on a host built after Ch35.
# The pip distributions in /usr/local/lib/python3.12/dist-packages on 2026-11-08 (Ch35 R1c):
# the runtime, its dependencies and the dev tools (dev tools stay out of the runtime, D1).
tango_ds_legacy_pip_packages:
  - pytango
  - numpy
  - psutil
  - pymodbus
  - sardana
  - taurus
  - lxml
  - pint
  - flexcache
  - flexparser
  - platformdirs
  - docstring_parser
  - pytest
  - iniconfig
  - pluggy
  - ruff
  - py_spy
tango_ds_legacy_pip_dir: /usr/local/lib/python3.12/dist-packages
tango_ds_legacy_code_dir: /opt/tango-devices
tango_ds_legacy_units:
  - magnet-socat
  - magnet-psu
  - faradaycup-picoammeter
  - faradaycup-adapter
  - camera-sim
  - vacuum-sim
  - interlock-sim
  - magnet
  - faradaycup
  - camera
  - vacuum
  - interlock
  - pool
  - macroserver
# Part 3's readiness helpers, in the package since Ch33 (/usr/libexec/beamline-tango/).
tango_ds_legacy_sbin:
  - tango-ds-wait
  - tango-ds-sardana-ready

tango_ds_tango_host: tango-db.beamline:10000

# Jive (Tango's Java database browser) from conda-forge, in its own environment under a
# pinned Miniforge. The checksum is the one the release publishes for this installer
# (checked 2026-10-19). Jive 7.46 is what Sept 2026 used; 8.0 exists.
tango_ds_miniforge_version: 26.7.2-0
tango_ds_miniforge_sha256: 281b0ac7d550802efc81af633225a5e6116d29ae72f3ab4eae7168c3931a4c05
tango_ds_miniforge_prefix: /opt/miniforge3
tango_ds_miniforge_installer: "Miniforge3-{{ tango_ds_miniforge_version }}-Linux-x86_64.sh"
tango_ds_miniforge_url: >-
  https://github.com/conda-forge/miniforge/releases/download/{{ tango_ds_miniforge_version }}/{{ tango_ds_miniforge_installer }}
tango_ds_jive_env: tango-gui
tango_ds_jive_version: "7.46"

# --- Ch29: the device servers -----------------------------------------------------------
# One entry per device server, used twice:
# - registration (files/tango-ds-register): server, class, device and the listed
#   properties are written wherever the Tango database differs. Unlisted properties and
#   memorized attribute values (the magnet's setpoint, the vacuum gauge's PumpStatus) are
#   left alone. Property values are strings, as the database stores them.
# - an instance of the package's template unit (Ch35), unit: <template>@<instance>, the
#   instance being the Tango instance name (asserted in the tasks). The role writes its
#   site data (/etc/beamline-tango/<template>-<instance>.env: the database, the endpoint
#   host, three fixed ports, the log level) and a drop-in with what it starts after here.
# Ports: CORBA (-ORBendPoint), ZeroMQ heartbeat and ZeroMQ event (TANGO_ZMQ_*_PORT); each
# kind is one contiguous block, opened in ufw as a range (asserted in the tasks). 28366 and
# 28367 stay free for Sardana's Pool and MacroServer (Ch31). All bind to the server's lab
# address only (they follow -ORBendPoint's host), below the kernel's ephemeral range.
# after: units started first (Wants= + After=). The Faraday cup, vacuum gauge and
# interlock heal by themselves when their simulator returns (Ch26-28), the camera since
# Ch29; the magnet after a lost PSU process is untested. binds_to: the magnet only - a
# socat restart makes new ptys, and the device reopens its port only at start (BindsTo=,
# so it restarts with its link). With real instruments these lists name what the device
# needs on that site, or nothing.
tango_ds_servers:
  - unit: tango-magnet@q1
    server: magnet_power_supply/q1
    class: MagnetPowerSupply
    device: linac/magnet/q1
    ports: {corba: 28368, heartbeat: 28468, event: 28568}
    after: [tango-sim-magnet-psu@q1]
    binds_to: [tango-sim-magnet-link@q1]
    properties:
      # The link's device end; the package's link unit makes /run/tango-magnet-<instance>/.
      port: /run/tango-magnet-q1/dev
      baudrate: "9600"
      ramp_rate: "5.0"
  - unit: tango-faradaycup@faradaycup1
    server: faraday_cup/faradaycup1
    class: FaradayCup
    device: linac/beam/faradaycup1
    ports: {corba: 28369, heartbeat: 28469, event: 28569}
    after: [tango-sim-prologix@faradaycup1]
    properties:
      PrologixHost: 127.0.0.1
      PrologixPort: "1234"
      GpibAddress: "22"
      PollIntervalMs: "500"
  - unit: tango-camera@ceyag1
    server: ceyag_camera/ceyag1
    class: CeYagCamera
    device: linac/camera/ceyag1
    ports: {corba: 28370, heartbeat: 28470, event: 28570}
    after: [tango-sim-camera@ceyag1]
    properties:
      host: 127.0.0.1
      port: "9999"
      frame_interval_ms: "200"
  - unit: tango-vacuum@gauge1
    server: vacuum_gauge/gauge1
    class: VacuumGauge
    device: linac/vacuum/gauge1
    ports: {corba: 28371, heartbeat: 28471, event: 28571}
    after: [tango-sim-vacuum@gauge1]
    properties:
      Host: 127.0.0.1
      Port: "5020"
      ModbusDeviceId: "1"
  - unit: tango-interlock@interlock1
    server: interlock_monitor/interlock1
    class: InterlockMonitor
    device: linac/safety/interlock1
    ports: {corba: 28372, heartbeat: 28472, event: 28572}
    after: [tango-sim-plc@interlock1]
    properties:
      Host: 127.0.0.1
      Port: "5040"

# The simulators: instances of the -simulators package's templates, on 127.0.0.1 or ptys
# only (never opened in ufw). env: their site data, where the template reads any (the
# magnet's link and PSU take only the instance). The ports are the ones the devices'
# properties above name. The package's units already carry the relations that hold on
# any site: the PSU bound to its link, the Prologix adapter after its picoammeter (Ch26).
tango_ds_simulators:
  - unit: tango-sim-magnet-link@q1
  - unit: tango-sim-magnet-psu@q1
  - unit: tango-sim-picoammeter@faradaycup1
    env: {SIM_PORT: 5025}
  - unit: tango-sim-prologix@faradaycup1
    env: {SIM_PORT: 1234, SIM_INSTRUMENT_HOST: 127.0.0.1, SIM_INSTRUMENT_PORT: 5025}
  - unit: tango-sim-camera@ceyag1
    env: {SIM_PORT: 9999, SIM_FRAME_INTERVAL_S: "0.5"}
  - unit: tango-sim-vacuum@gauge1
    env: {SIM_PORT: 5020}
  - unit: tango-sim-plc@interlock1
    env: {SIM_PORT: 5040}

# -ORBendPoint's host: the servers bind to this name's lab address and publish it.
tango_ds_endpoint_host: "{{ inventory_hostname }}"
# Tango's console log level for the servers (4 = info): the devices' own error_stream
# and info_stream lines reach the journal (Ch29 probe L1). Python logging (the Faraday
# cup) goes to stderr regardless.
tango_ds_log_level: 4
tango_ds_allowed_from: 10.10.10.0/24

# --- Ch31: Sardana's servers -------------------------------------------------------------
# One entry per Sardana server, each with its devices, named as Sardana's own registration
# (register_sardana() in sardana/tango/core/util.py, 3.7.0) would name them, which are the
# names the September elements and tests use. files/tango-ds-register writes them like
# tango_ds_servers; a server whose instance is registered never asks its interactive
# "does not exist" and "select the Pool" questions, which a unit can't answer.
# - Pool: PoolPath is where it looks for controller modules: the package's
#   sardana_controllers (Ch35). It imports every .py file there at every start, so a module
#   with top-level code runs then (Ch7's lab72_proof.py, now in tango-devices' tools/).
# - MacroServer: PoolNames connects it to the Pool. EnvironmentDb "property:<object>" keeps
#   its environment (ActiveMntGrp, ...) as free properties of that Tango DB object, so its
#   unit needs no writable path. Given a path it can't write, init_device() replaces this
#   property with a mkdtemp() path in the database; the role would show that as drift.
# Ports continue tango_ds_servers' blocks just below them (..66 Pool, ..67 MacroServer).
# The package's units carry the rest of Ch31: the Pool counts as started once it listens,
# the MacroServer is PartOf= its Pool (a macro started in the first seconds after a Pool
# restart can hang for good, Ch31 LAB 31.7) and counts as started once it knows every
# element the Pool has (pool_device, the readiness check's second argument).
tango_ds_sardana_servers:
  - unit: tango-pool@linac
    server: Pool/linac
    ports: {corba: 28366, heartbeat: 28466, event: 28566}
    after: [tango-magnet@q1, tango-faradaycup@faradaycup1]
    devices:
      - class: Pool
        device: pool/linac/1
        alias: Pool_linac_1
        properties:
          PoolPath: ["{{ tango_ds_runtime }}/lib/python3.12/site-packages/beamline_tango/sardana_controllers"]
  - unit: tango-macroserver@linac
    server: MacroServer/linac
    ports: {corba: 28367, heartbeat: 28467, event: 28567}
    pool_device: pool/linac/1
    devices:
      - class: MacroServer
        device: macroserver/linac/1
        alias: MS_linac_1
        properties:
          PoolNames: [Pool_linac_1]
          EnvironmentDb: property:SardanaEnv_linac
      - class: Door
        device: door/linac/1
        alias: Door_linac_1
# Console level of Sardana's servers, all of which goes to the journal (Ch31): info shows
# the controller and macro modules each server loads at start; warning would hide them.
tango_ds_sardana_log_level: info

# The Sardana lab's elements (Ch31), created by files/tango-ds-sardana-elements once the
# servers run: the magnet as a motor and the Faraday cup as a 0D channel (Ch7's design),
# the measurement group the scans use, and the MacroServer variable that selects it. The
# names are the ones tango-devices' sardana_controllers/tests use. An existing element
# that differs from this is an error: the script never deletes or recreates one
# (deleting controllers triggered Ch7's MacroServer race). library is the module name.
tango_ds_sardana_elements:
  pool: pool/linac/1
  macroserver: macroserver/linac/1
  door: door/linac/1
  controllers:
    - name: magnet_ctrl
      type: Motor
      library: magnet_motor_ctrl
      klass: MagnetMotorController
      properties:
        TangoDevice: linac/magnet/q1
      elements:
        - {name: magnet_mot, axis: 1, full_name: motor/magnet_ctrl/1}
    - name: fc_ctrl
      type: ZeroDExpChannel
      library: faraday_zerod_ctrl
      klass: FaradayZeroDController
      properties:
        TangoDevice: linac/beam/faradaycup1
      elements:
        - {name: fc_ctr, axis: 1, full_name: expchan/fc_ctrl/1}
  measurement_groups:
    - {name: fc_mg, full_name: mntgrp/pool_linac_1/fc_mg, elements: [fc_ctr]}
  environment:
    ActiveMntGrp: fc_mg

# Attribute descriptions and alarm levels kept in the Tango database (Ch32): site values
# the device code doesn't carry, set through the running devices by
# files/tango-ds-attribute-config, so they apply at once. Only the keys listed here are
# compared and written; levels are strings, as Tango stores them. A device reports State
# ALARM while one of its attributes is past a level, and its operator actions stay
# allowed there (tango-devices 2c759c8). The vacuum's levels assume the pump runs: with
# it off the simulator holds 1.0 mbar, which is an alarm.
tango_ds_attribute_config:
  - device: linac/vacuum/gauge1
    attributes:
      VacuumPressure:
        description: >-
          Pressure read from the gauge. Warning above 0.1 mbar, alarm above 0.5 mbar
          (site levels, tango_ds role).
        max_warning: "0.1"
        max_alarm: "0.5"
        # Scientific notation: a real gauge reads down to 1e-11 mbar, which Tango's
        # default "%6.2f" shows as 0.00 (Ch32, 31 Oct).
        format: "%.2e"
      PumpStatus:
        description: >-
          Vacuum pump on (true) or off. Memorized: restored at every start of the
          server.

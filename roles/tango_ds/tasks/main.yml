---
# tasks file for tango_ds (handbook Part 3, Ch23)
#
# This host runs everything except the Tango Database itself (roles/tango_db): the Tango
# client side, PyTango and the device servers, their protocol simulators, Jive.
#
# Check mode works before the first install: the tasks that need packages this role
# installs (pip) may fail only while those packages would still be
# installed (failed_when below). A real run fails on any error.

# No recommends: python3-pip recommends build-essential and python3-dev, which would bring a
# C/C++ toolchain back onto this host (11 compiler/dev packages, Ch23 gate 1). Every pip
# package here installs from a binary wheel, so none of them is needed.
- name: Install the Tango client side, the simulators' tools and the debugging tools
  ansible.builtin.apt:
    name: "{{ tango_ds_apt_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
  register: tango_ds_apt

- name: Install PyTango and the Python packages the devices and tests use (pinned)
  ansible.builtin.pip:
    name: "{{ tango_ds_pip_packages }}"
  # PIP_BREAK_SYSTEM_PACKAGES rather than extra_args: with any extra_args the pip
  # module reports "changed" in check mode without looking at what is installed,
  # so the fleet drift check could never pass for this task (Ch23).
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  register: tango_ds_pip
  failed_when:
    - tango_ds_pip is failed
    - not (ansible_check_mode and tango_ds_apt is changed)

- name: Set TANGO_HOST in /etc/environment so device servers and clients find the database
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^TANGO_HOST='
    line: "TANGO_HOST={{ tango_ds_tango_host }}"

# Redis left with the last device that used it (Ch27); see the defaults for what stays.
- name: Remove Redis (no device uses it since Ch27)
  ansible.builtin.apt:
    name: "{{ tango_ds_apt_packages_absent }}"
    state: absent
    purge: true

- name: Remove the Redis Python client
  ansible.builtin.pip:
    name: "{{ tango_ds_pip_packages_absent }}"
    state: absent
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  register: tango_ds_pip_absent
  failed_when:
    - tango_ds_pip_absent is failed
    - not (ansible_check_mode and tango_ds_apt is changed)

# --- Jive (Tango database browser) -----------------------------------------------------
# Jive is a Java/Swing application that the Debian/Ubuntu Tango packages don't ship. It
# comes from conda-forge, with its own OpenJDK, in a dedicated environment kept apart from
# the apt/pip PyTango toolchain above.
- name: Check whether Miniforge is installed
  ansible.builtin.stat:
    path: "{{ tango_ds_miniforge_prefix }}/bin/conda"
  register: tango_ds_conda

- name: Download the pinned Miniforge installer, verified against its published SHA-256
  ansible.builtin.get_url:
    url: "{{ tango_ds_miniforge_url }}"
    dest: "/var/tmp/{{ tango_ds_miniforge_installer }}"
    checksum: "sha256:{{ tango_ds_miniforge_sha256 }}"
    mode: "0700"
  when: not tango_ds_conda.stat.exists

- name: Install Miniforge
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "/var/tmp/{{ tango_ds_miniforge_installer }}"
      - -b
      - -p
      - "{{ tango_ds_miniforge_prefix }}"
    creates: "{{ tango_ds_miniforge_prefix }}/bin/conda"
  register: tango_ds_miniforge_install

- name: Remove the Miniforge installer
  ansible.builtin.file:
    path: "/var/tmp/{{ tango_ds_miniforge_installer }}"
    state: absent

- name: Ensure Miniforge is readable and usable by all users
  ansible.builtin.file:
    path: "{{ tango_ds_miniforge_prefix }}"
    mode: "0755"
  when: >-
    tango_ds_conda.stat.exists or
    (tango_ds_miniforge_install is changed and not ansible_check_mode)

- name: Create the Jive environment from conda-forge (pinned Jive)
  ansible.builtin.command:
    argv:
      - "{{ tango_ds_miniforge_prefix }}/bin/conda"
      - create
      - --yes
      - --name
      - "{{ tango_ds_jive_env }}"
      - --channel
      - conda-forge
      - "jive={{ tango_ds_jive_version }}"
    creates: "{{ tango_ds_miniforge_prefix }}/envs/{{ tango_ds_jive_env }}/bin/jive"

# conda run puts the environment's bin/ on PATH, so Jive's launcher finds its java
# (calling the env's jive directly failed with "java: not found", Sept 2026).
- name: Install a wrapper so 'jive' works as a normal command
  ansible.builtin.copy:
    dest: /usr/local/bin/jive
    mode: "0755"
    content: |
      #!/bin/bash
      # Managed by Ansible (beamline-ansible, role tango_ds) - do not edit on the host.
      # Jive from conda-forge, in the dedicated '{{ tango_ds_jive_env }}' environment.
      exec {{ tango_ds_miniforge_prefix }}/bin/conda run -n {{ tango_ds_jive_env }} jive "$@"

# --- Ch29: registration of the device servers, and of Sardana's since Ch31 -------------
# Which server runs which device, and with which properties, lives in the Tango database,
# not in a file on this host. The role keeps it in step with tango_ds_servers and
# tango_ds_sardana_servers, as roles/tango_db does with its schema fix: compare first
# (read-only, so it also runs in check mode), then write only what differs.
- name: Install the registration script
  ansible.builtin.copy:
    src: tango-ds-register
    dest: /usr/local/sbin/tango-ds-register
    owner: root
    group: root
    mode: "0755"
  register: tango_ds_register_script
  tags: [tango_ds_register]

- name: Compare the device-server registrations with the Tango database
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-register, --check]
    stdin: "{{ (tango_ds_servers + tango_ds_sardana_servers) | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  register: tango_ds_registration
  check_mode: false
  # In check mode a difference is the change a real run would make, so it is reported as
  # one (the fleet drift check sees it). In a real run the write task below makes it.
  changed_when:
    - ansible_check_mode
    - tango_ds_registration.rc == 0
    - (tango_ds_registration.stdout | from_json).changes | length > 0
  # In check mode before the first install the script doesn't exist yet. Real runs fail
  # hard on any error.
  failed_when:
    - tango_ds_registration.rc | default(1) != 0
    - not (ansible_check_mode and tango_ds_register_script is changed)
  tags: [tango_ds_register]

- name: Show the registration differences
  ansible.builtin.debug:
    msg: "{{ (tango_ds_registration.stdout | from_json).changes }}"
  when:
    - tango_ds_registration.rc == 0
    - (tango_ds_registration.stdout | from_json).changes | length > 0
  tags: [tango_ds_register]

- name: Register what differs (servers, devices, properties)
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-register]
    stdin: "{{ (tango_ds_servers + tango_ds_sardana_servers) | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  when:
    - tango_ds_registration.rc == 0
    - (tango_ds_registration.stdout | from_json).changes | length > 0
  changed_when: true
  register: tango_ds_registration_write
  tags: [tango_ds_register]

# --- Ch29: the device servers and their simulators as services --------------------------
# One unit per process (5 servers, 7 simulator processes), all from one template, grouped
# under tango-lab.target. Code updates in /opt/tango-devices stay a manual pull (Ch23);
# after one, restart the affected units by hand.
- name: Install the readiness helper the units call from ExecStartPost
  ansible.builtin.copy:
    src: tango-ds-wait
    dest: /usr/local/sbin/tango-ds-wait
    owner: root
    group: root
    mode: "0755"
  tags: [tango_ds_services]

- name: Install the target that groups the Tango lab units
  ansible.builtin.template:
    src: tango-lab.target.j2
    dest: /etc/systemd/system/tango-lab.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [tango_ds_services]

- name: Install the simulator units
  ansible.builtin.template:
    src: tango-ds-unit.service.j2
    dest: "/etc/systemd/system/tango-{{ unit.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ tango_ds_simulators }}"
  loop_control:
    loop_var: unit
    label: "tango-{{ unit.name }}"
  register: tango_ds_simulator_units
  notify: Reload systemd
  tags: [tango_ds_services]

- name: Install the device-server units
  ansible.builtin.template:
    src: tango-ds-unit.service.j2
    dest: "/etc/systemd/system/tango-{{ unit.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ tango_ds_servers }}"
  loop_control:
    loop_var: unit
    label: "tango-{{ unit.name }}"
  register: tango_ds_server_units
  notify: Reload systemd
  tags: [tango_ds_services]

# The firewall opens each kind of port as one range; a gap or a duplicate would open a
# port no server owns, or leave one closed.
- name: Check that each kind of fixed port forms one contiguous block
  ansible.builtin.assert:
    that:
      - ports | unique | length == tango_ds_servers | length
      - (ports | max) - (ports | min) + 1 == tango_ds_servers | length
    fail_msg: "{{ kind }} ports {{ ports | sort }} are not one contiguous block"
    quiet: true
  vars:
    ports: "{{ tango_ds_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_ds_firewall]

- name: Open the device servers' fixed ports to the lab network
  community.general.ufw:
    rule: allow
    port: "{{ ports | min }}:{{ ports | max }}"
    proto: tcp
    from_ip: "{{ tango_ds_allowed_from }}"
    comment: "Tango device servers, {{ kind }} ports, lab network (Ch29)"
  vars:
    ports: "{{ tango_ds_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_ds_firewall]

- name: Make systemd read the new and changed units now
  ansible.builtin.meta: flush_handlers
  tags: [tango_ds_services]

- name: Enable every unit, so the target starts it at boot
  ansible.builtin.systemd_service:
    name: "tango-{{ unit }}.service"
    enabled: true
  loop: "{{ (tango_ds_simulators + tango_ds_servers) | map(attribute='name') | list }}"
  loop_control:
    loop_var: unit
  # In check mode the units above are only simulated, so systemd doesn't know them yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

- name: Keep the target enabled and started (starts every unit, in dependency order)
  ansible.builtin.systemd_service:
    name: tango-lab.target
    enabled: true
    state: started
  register: tango_ds_target
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

# Units already running pick up a changed unit file, or changed registration properties,
# only at a restart. Simulators first: a socat restart also restarts the units bound to it.
# Only when the target task succeeded without starting anything: if it has just started
# the units they are fresh, and if it failed (check mode before the first install) there
# is nothing to restart.
- name: Restart the simulator units whose unit file changed
  ansible.builtin.systemd_service:
    name: "tango-{{ item.unit.name }}.service"
    state: restarted
  loop: "{{ tango_ds_simulator_units.results }}"
  loop_control:
    label: "tango-{{ item.unit.name }}"
  when:
    - item is changed
    - tango_ds_target is succeeded
    - tango_ds_target is not changed
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

- name: Restart the device servers whose unit file or registration changed
  ansible.builtin.systemd_service:
    name: "tango-{{ item.unit.name }}.service"
    state: restarted
  loop: "{{ tango_ds_server_units.results }}"
  loop_control:
    label: "tango-{{ item.unit.name }}"
  vars:
    registration_written: "{{ tango_ds_registration_write | default({}) is changed }}"
    # default(.., true): with a changed script, check mode leaves stdout '' (not undefined).
    registration_changes: "{{ (tango_ds_registration.stdout | default('{}', true) | from_json).changes | default([]) }}"
  when:
    - >-
      item is changed or (registration_written and
      registration_changes | select('match', item.unit.device ~ ':') | list | length > 0)
    - tango_ds_target is succeeded
    - tango_ds_target is not changed
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

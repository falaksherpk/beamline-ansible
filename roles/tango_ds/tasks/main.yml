# SPDX-License-Identifier: MIT-0
---
# tasks file for tango_ds (handbook Part 3, Ch23; Part 4, Ch35)
#
# This host runs everything except the Tango Database itself (roles/tango_db): the Tango
# client side, the device servers and their protocol simulators from the lab's apt
# repository (Ch35), Sardana's Pool and MacroServer, Jive.
#
# Check mode works before the first install: the tasks that need the packages this role
# installs may fail only while those packages would still be installed (failed_when
# below). A real run fails on any error.

- name: Install the Tango client side, the simulators' tools and the debugging tools
  ansible.builtin.apt:
    name: "{{ tango_ds_apt_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Set TANGO_HOST in /etc/environment so device servers and clients find the database
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^TANGO_HOST='
    line: "TANGO_HOST={{ tango_ds_tango_host }}"

# Redis left with the last device that used it (Ch27); see the defaults for what stays.
- name: Remove Redis (no device uses it since Ch27)
  ansible.builtin.apt:
    name: "{{ tango_ds_apt_packages_absent }}"
    state: absent
    purge: true

# --- Ch35: the device servers' packages -------------------------------------------------
# The package lists are refreshed only when the pinned version isn't the installed one, so
# a converged run needs no network; a new pin finds a release published since the last
# refresh. The packages are held, so an 'apt upgrade' by hand leaves them alone: the
# venv changes under running servers only through this role, which then restarts them.
- name: Read which versions of the device-server packages are installed
  ansible.builtin.command:
    argv: "{{ tango_ds_query + tango_ds_packages }}"
  vars:
    tango_ds_query:
      - dpkg-query
      - --show
      - --showformat=${Package} ${Version}\n
  register: tango_ds_pkg_query
  check_mode: false
  changed_when: false
  # Exit 1 while a package is unknown to dpkg; the comparison below decides.
  failed_when: false

# check_mode: false, because in check mode the apt module never refreshes the lists, so a
# host whose lists predate the pinned release could not even be checked (Ch35 S2). A
# refresh changes no installed package, and a converged host skips it.
- name: Refresh the package lists when the pinned version isn't the installed one
  ansible.builtin.apt:
    update_cache: true
  vars:
    tango_ds_pkg_wanted: "{{ tango_ds_packages | map('regex_replace', '$', ' ' ~ tango_ds_package_version) | sort }}"
  when: tango_ds_pkg_query.stdout_lines | sort != tango_ds_pkg_wanted
  check_mode: false
  changed_when: false

- name: Install the device servers and simulators at the pinned version
  ansible.builtin.apt:
    name: "{{ tango_ds_packages | map('regex_replace', '$', '=' ~ tango_ds_package_version) | list }}"
    state: present
    install_recommends: false
    allow_change_held_packages: true
  register: tango_ds_pkg
  # A new release replaces the package's unit files, and systemd keeps running the loaded
  # ones until a daemon-reload, which the package's postinst doesn't do. The handler is
  # flushed before the instances restart below (Ch35 S13c: without it they came back from
  # 1.0.0's units).
  notify: Reload systemd

- name: Hold the device servers and simulators at that version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ tango_ds_packages }}"
  # In check mode before the first install dpkg doesn't know them yet.
  ignore_errors: "{{ ansible_check_mode and tango_ds_pkg | default({}) is changed }}"

# --- Jive (Tango database browser) -----------------------------------------------------
# Jive is a Java/Swing application that the Debian/Ubuntu Tango packages don't ship. It
# comes from conda-forge, with its own OpenJDK, in a dedicated environment kept apart from
# the apt/pip PyTango toolchain above.
- name: Check whether Miniforge is installed
  ansible.builtin.stat:
    path: "{{ tango_ds_miniforge_prefix }}/bin/conda"
  register: tango_ds_conda

- name: Download the pinned Miniforge installer, verified against its published SHA-256
  ansible.builtin.get_url:
    url: "{{ tango_ds_miniforge_url }}"
    dest: "/var/tmp/{{ tango_ds_miniforge_installer }}"
    checksum: "sha256:{{ tango_ds_miniforge_sha256 }}"
    mode: "0700"
  when: not tango_ds_conda.stat.exists

- name: Install Miniforge
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "/var/tmp/{{ tango_ds_miniforge_installer }}"
      - -b
      - -p
      - "{{ tango_ds_miniforge_prefix }}"
    creates: "{{ tango_ds_miniforge_prefix }}/bin/conda"
  register: tango_ds_miniforge_install

- name: Remove the Miniforge installer
  ansible.builtin.file:
    path: "/var/tmp/{{ tango_ds_miniforge_installer }}"
    state: absent

- name: Ensure Miniforge is readable and usable by all users
  ansible.builtin.file:
    path: "{{ tango_ds_miniforge_prefix }}"
    mode: "0755"
  when: >-
    tango_ds_conda.stat.exists or
    (tango_ds_miniforge_install is changed and not ansible_check_mode)

- name: Create the Jive environment from conda-forge (pinned Jive)
  ansible.builtin.command:
    argv:
      - "{{ tango_ds_miniforge_prefix }}/bin/conda"
      - create
      - --yes
      - --name
      - "{{ tango_ds_jive_env }}"
      - --channel
      - conda-forge
      - "jive={{ tango_ds_jive_version }}"
    creates: "{{ tango_ds_miniforge_prefix }}/envs/{{ tango_ds_jive_env }}/bin/jive"

# conda run puts the environment's bin/ on PATH, so Jive's launcher finds its java
# (calling the env's jive directly failed with "java: not found", Sept 2026).
- name: Install a wrapper so 'jive' works as a normal command
  ansible.builtin.copy:
    dest: /usr/local/bin/jive
    mode: "0755"
    content: |
      #!/bin/bash
      # Managed by Ansible (beamline-ansible, role tango_ds) - do not edit on the host.
      # Jive from conda-forge, in the dedicated '{{ tango_ds_jive_env }}' environment.
      exec {{ tango_ds_miniforge_prefix }}/bin/conda run -n {{ tango_ds_jive_env }} jive "$@"

# --- Ch29: registration of the device servers, and of Sardana's since Ch31 -------------
# Which server runs which device, and with which properties, lives in the Tango database,
# not in a file on this host. The role keeps it in step with tango_ds_servers and
# tango_ds_sardana_servers, as roles/tango_db does with its schema fix: compare first
# (read-only, so it also runs in check mode), then write only what differs. The scripts
# run on the package's runtime (Ch35); in check mode before the first install, on
# whatever the host had.
- name: Check that each server's unit instance is its Tango instance name
  ansible.builtin.assert:
    that:
      - entry.unit.split('@') | length == 2
      - entry.unit.split('@')[1] == entry.server.split('/')[1]
    fail_msg: "{{ entry.unit }} doesn't run Tango instance {{ entry.server }}"
    quiet: true
  loop: "{{ tango_ds_servers + tango_ds_sardana_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  tags: [tango_ds_register, tango_ds_services]

- name: Install the registration script
  ansible.builtin.copy:
    src: tango-ds-register
    dest: /usr/local/sbin/tango-ds-register
    owner: root
    group: root
    mode: "0755"
  register: tango_ds_register_script
  tags: [tango_ds_register]

- name: Compare the device-server registrations with the Tango database
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-register, --check]
    stdin: "{{ (tango_ds_servers + tango_ds_sardana_servers) | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  register: tango_ds_registration
  check_mode: false
  # In check mode a difference is the change a real run would make, so it is reported as
  # one (the fleet drift check sees it). In a real run the write task below makes it.
  changed_when:
    - ansible_check_mode
    - tango_ds_registration.rc == 0
    - (tango_ds_registration.stdout | from_json).changes | length > 0
  # In check mode before the first install the script or its interpreter may not exist
  # yet. Real runs fail hard on any error.
  failed_when:
    - tango_ds_registration.rc | default(1) != 0
    - not (ansible_check_mode and (tango_ds_register_script is changed or tango_ds_pkg | default({}) is changed))
  tags: [tango_ds_register]

- name: Show the registration differences
  ansible.builtin.debug:
    msg: "{{ (tango_ds_registration.stdout | from_json).changes }}"
  when:
    - tango_ds_registration.rc == 0
    - (tango_ds_registration.stdout | from_json).changes | length > 0
  tags: [tango_ds_register]

- name: Register what differs (servers, devices, properties)
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-register]
    stdin: "{{ (tango_ds_servers + tango_ds_sardana_servers) | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  when:
    - tango_ds_registration.rc == 0
    - (tango_ds_registration.stdout | from_json).changes | length > 0
  changed_when: true
  register: tango_ds_registration_write
  tags: [tango_ds_register]

# The firewall opens each kind of port as one range; a gap or a duplicate would open a
# port no server owns, or leave one closed.
- name: Check that each kind of fixed port forms one contiguous block
  ansible.builtin.assert:
    that:
      - ports | unique | length == tango_ds_servers | length
      - (ports | max) - (ports | min) + 1 == tango_ds_servers | length
    fail_msg: "{{ kind }} ports {{ ports | sort }} are not one contiguous block"
    quiet: true
  vars:
    ports: "{{ tango_ds_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_ds_firewall]

- name: Open the device servers' fixed ports to the lab network
  community.general.ufw:
    rule: allow
    port: "{{ ports | min }}:{{ ports | max }}"
    proto: tcp
    from_ip: "{{ tango_ds_allowed_from }}"
    comment: "Tango device servers, {{ kind }} ports, lab network (Ch29)"
  vars:
    ports: "{{ tango_ds_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_ds_firewall]

- name: Check that each kind of Sardana port forms one block, clear of the device servers'
  ansible.builtin.assert:
    that:
      - ports | unique | length == tango_ds_sardana_servers | length
      - (ports | max) - (ports | min) + 1 == tango_ds_sardana_servers | length
      - ports | intersect(tango_ds_servers | map(attribute='ports.' ~ kind) | list) | length == 0
    fail_msg: "Sardana {{ kind }} ports {{ ports | sort }} are not one free contiguous block"
    quiet: true
  vars:
    ports: "{{ tango_ds_sardana_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_ds_firewall]

- name: Open Sardana's fixed ports to the lab network
  community.general.ufw:
    rule: allow
    port: "{{ ports | min }}:{{ ports | max }}"
    proto: tcp
    from_ip: "{{ tango_ds_allowed_from }}"
    comment: "Sardana servers, {{ kind }} ports, lab network (Ch31)"
  vars:
    ports: "{{ tango_ds_sardana_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_ds_firewall]

# --- Ch35: the package's template units, with this site's data --------------------------
# One instance per process (7 simulators, 5 servers, Pool and MacroServer), each
# WantedBy= and PartOf= the package's tango-lab.target. The role writes every instance's
# site data and ordering before it enables any, since an instance whose environment file
# is missing fails only at start (Ch33).
- name: Create the directory for the instances' site data
  ansible.builtin.file:
    path: "{{ tango_ds_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [tango_ds_services]

- name: Write the simulators' site data
  ansible.builtin.template:
    src: beamline-tango.env.j2
    dest: "{{ tango_ds_env_dir }}/{{ entry.unit | replace('@', '-') }}.env"
    owner: root
    group: root
    mode: "0644"
  vars:
    env: "{{ entry.env }}"
  loop: "{{ tango_ds_simulators | selectattr('env', 'defined') | list }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  register: tango_ds_simulator_env
  tags: [tango_ds_services]

- name: Write the device servers' site data
  ansible.builtin.template:
    src: beamline-tango.env.j2
    dest: "{{ tango_ds_env_dir }}/{{ entry.unit | replace('@', '-') }}.env"
    owner: root
    group: root
    mode: "0644"
  vars:
    env:
      TANGO_HOST: "{{ tango_ds_tango_host }}"
      TANGO_ENDPOINT_HOST: "{{ tango_ds_endpoint_host }}"
      TANGO_CORBA_PORT: "{{ entry.ports.corba }}"
      TANGO_ZMQ_HEARTBEAT_PORT: "{{ entry.ports.heartbeat }}"
      TANGO_ZMQ_EVENT_PORT: "{{ entry.ports.event }}"
      TANGO_LOG_LEVEL: "{{ tango_ds_log_level }}"
  loop: "{{ tango_ds_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  register: tango_ds_server_env
  tags: [tango_ds_services]

- name: Write the Sardana servers' site data
  ansible.builtin.template:
    src: beamline-tango.env.j2
    dest: "{{ tango_ds_env_dir }}/{{ entry.unit | replace('@', '-') }}.env"
    owner: root
    group: root
    mode: "0644"
  vars:
    common:
      TANGO_HOST: "{{ tango_ds_tango_host }}"
      TANGO_ENDPOINT_HOST: "{{ tango_ds_endpoint_host }}"
      TANGO_CORBA_PORT: "{{ entry.ports.corba }}"
      TANGO_ZMQ_HEARTBEAT_PORT: "{{ entry.ports.heartbeat }}"
      TANGO_ZMQ_EVENT_PORT: "{{ entry.ports.event }}"
      SARDANA_LOG_LEVEL: "{{ tango_ds_sardana_log_level }}"
    # The MacroServer's readiness check: its own device and its Pool's.
    macroserver:
      SARDANA_MACROSERVER_DEVICE: "{{ entry.devices[0].device }}"
      SARDANA_POOL_DEVICE: "{{ entry.pool_device | default('') }}"
    env: "{{ common | combine(macroserver if entry.pool_device is defined else {}) }}"
  loop: "{{ tango_ds_sardana_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  register: tango_ds_sardana_env
  tags: [tango_ds_services]

- name: Create the drop-in directories of the instances that start after others here
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ entry.unit }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ tango_ds_servers + tango_ds_sardana_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  when: entry.after is defined or entry.binds_to is defined
  tags: [tango_ds_services]

- name: Write what each of them starts after on this site
  ansible.builtin.template:
    src: beamline-tango-site.conf.j2
    dest: "/etc/systemd/system/{{ entry.unit }}.service.d/50-beamline-site.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ tango_ds_servers + tango_ds_sardana_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  when: entry.after is defined or entry.binds_to is defined
  register: tango_ds_dropins
  notify: Reload systemd
  tags: [tango_ds_services]

# --- Ch35: the switch from Part 3's units, once ------------------------------------------
# Part 3 rendered one unit per process into /etc/systemd/system, and its own
# tango-lab.target there, which would hide the package's (/etc wins over /usr/lib). Old
# and new units bind the same ports, so the old ones stop first: the lab is down from here
# until the target starts the instances below (about a minute; HDB++ records the gap).
# Everything here keys on the old target file, which goes last, so a run that stops
# halfway resumes the switch.
- name: Look for Part 3's role-rendered target
  ansible.builtin.stat:
    path: /etc/systemd/system/tango-lab.target
  register: tango_ds_legacy_target
  tags: [tango_ds_services]

- name: Stop Part 3's lab (every unit is PartOf= its target)
  ansible.builtin.systemd_service:
    name: tango-lab.target
    state: stopped
  when: tango_ds_legacy_target.stat.exists
  tags: [tango_ds_services]

- name: Stop and disable Part 3's units
  ansible.builtin.systemd_service:
    name: "tango-{{ item }}.service"
    state: stopped
    enabled: false
  loop: "{{ tango_ds_legacy_units }}"
  when: tango_ds_legacy_target.stat.exists
  tags: [tango_ds_services]

- name: Disable Part 3's target
  ansible.builtin.systemd_service:
    name: tango-lab.target
    enabled: false
  when: tango_ds_legacy_target.stat.exists
  tags: [tango_ds_services]

- name: Remove Part 3's unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/tango-{{ item }}.service"
    state: absent
  loop: "{{ tango_ds_legacy_units }}"
  when: tango_ds_legacy_target.stat.exists
  tags: [tango_ds_services]

- name: Remove Part 3's target, its wants directory first
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/tango-lab.target.wants
    - /etc/systemd/system/tango-lab.target
  when: tango_ds_legacy_target.stat.exists
  notify: Reload systemd
  tags: [tango_ds_services]

- name: Make systemd read the package's units, the drop-ins and the removals now
  ansible.builtin.meta: flush_handlers
  tags: [tango_ds_services]

- name: Enable every instance, so the target starts it at boot
  ansible.builtin.systemd_service:
    name: "{{ unit }}.service"
    enabled: true
  loop: "{{ (tango_ds_simulators + tango_ds_servers + tango_ds_sardana_servers) | map(attribute='unit') | list }}"
  loop_control:
    loop_var: unit
  # In check mode before the first install systemd doesn't know the templates yet.
  ignore_errors: "{{ ansible_check_mode and tango_ds_pkg | default({}) is changed }}"
  tags: [tango_ds_services]

- name: Keep the target enabled and started (starts every instance, in dependency order)
  ansible.builtin.systemd_service:
    name: tango-lab.target
    enabled: true
    state: started
  register: tango_ds_target
  ignore_errors: "{{ ansible_check_mode and tango_ds_pkg | default({}) is changed }}"
  tags: [tango_ds_services]

# Running instances pick up a new release, changed site data, a changed drop-in or
# changed registration properties only at a restart. Only when the target task succeeded
# without starting anything: if it has just started the instances they are fresh, and if
# it failed (check mode before the first install) there is nothing to restart.
# A new release changes the runtime under all of them: the target restarts them all, in
# dependency order (PartOf=). Otherwise only the instances whose own data changed,
# simulators first (a magnet link's restart also restarts what is bound to it), the Pool
# before the MacroServer (list order; the MacroServer is PartOf= it).
- name: Restart every instance after a new release
  ansible.builtin.systemd_service:
    name: tango-lab.target
    state: restarted
  when:
    - tango_ds_pkg | default({}) is changed
    - tango_ds_target is succeeded
    - tango_ds_target is not changed
  register: tango_ds_restart_all
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

- name: Restart the simulators whose site data changed
  ansible.builtin.systemd_service:
    name: "{{ entry.unit }}.service"
    state: restarted
  loop: "{{ tango_ds_simulators }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  vars:
    changed_units: "{{ tango_ds_simulator_env.results | selectattr('changed') | map(attribute='entry.unit') | list }}"
  when:
    - entry.unit in changed_units
    - tango_ds_restart_all is skipped
    - tango_ds_target is succeeded
    - tango_ds_target is not changed
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

- name: Restart the device servers whose site data, drop-in or registration changed
  ansible.builtin.systemd_service:
    name: "{{ entry.unit }}.service"
    state: restarted
  loop: "{{ tango_ds_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  vars:
    changed_units: "{{ (tango_ds_server_env.results + tango_ds_dropins.results) | selectattr('changed') | map(attribute='entry.unit') | list }}"
    registration_written: "{{ tango_ds_registration_write | default({}) is changed }}"
    # default(.., true): with a changed script, check mode leaves stdout '' (not undefined).
    registration_changes: "{{ (tango_ds_registration.stdout | default('{}', true) | from_json).changes | default([]) }}"
  when:
    - >-
      entry.unit in changed_units or (registration_written and
      registration_changes | select('match', entry.device ~ ':') | list | length > 0)
    - tango_ds_restart_all is skipped
    - tango_ds_target is succeeded
    - tango_ds_target is not changed
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

- name: Restart the Sardana servers whose site data, drop-in or registration changed
  ansible.builtin.systemd_service:
    name: "{{ entry.unit }}.service"
    state: restarted
  loop: "{{ tango_ds_sardana_servers }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.unit }}"
  vars:
    changed_units: "{{ (tango_ds_sardana_env.results + tango_ds_dropins.results) | selectattr('changed') | map(attribute='entry.unit') | list }}"
    registration_written: "{{ tango_ds_registration_write | default({}) is changed }}"
    registration_changes: "{{ (tango_ds_registration.stdout | default('{}', true) | from_json).changes | default([]) }}"
    changed_devices: "{{ registration_changes | map('regex_replace', ':.*$', '') | list }}"
  when:
    - >-
      entry.unit in changed_units or (registration_written and
      changed_devices | intersect(entry.devices | map(attribute='device') | list) | length > 0)
    - tango_ds_restart_all is skipped
    - tango_ds_target is succeeded
    - tango_ds_target is not changed
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_ds_services]

# --- Ch31: Sardana's elements -------------------------------------------------------------
# Controllers, elements and measurement groups live in the Tango database, the MacroServer
# environment in SardanaEnv_linac's free properties. The role keeps them in step with
# tango_ds_sardana_elements as it does registrations: compare first (read-only, so it also
# runs in check mode), then create only what is missing. A difference it won't fix fails
# the play with the script's errors (exit 2), in check mode too.
- name: Install the Sardana elements script
  ansible.builtin.copy:
    src: tango-ds-sardana-elements
    dest: /usr/local/sbin/tango-ds-sardana-elements
    owner: root
    group: root
    mode: "0755"
  register: tango_ds_elements_script
  tags: [tango_ds_sardana_elements]

- name: Compare the Sardana elements with the Pool and the MacroServer
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-sardana-elements, --check]
    stdin: "{{ tango_ds_sardana_elements | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  register: tango_ds_elements
  check_mode: false
  changed_when:
    - ansible_check_mode
    - tango_ds_elements.rc == 0
    - (tango_ds_elements.stdout | from_json).changes | length > 0
  # In check mode before the first install the script, its interpreter or the servers may
  # not exist yet.
  failed_when:
    - tango_ds_elements.rc | default(1) != 0
    - not (ansible_check_mode and (tango_ds_elements_script is changed or
      tango_ds_pkg | default({}) is changed))
  tags: [tango_ds_sardana_elements]

- name: Show the Sardana element differences
  ansible.builtin.debug:
    msg: "{{ (tango_ds_elements.stdout | from_json).changes }}"
  when:
    - tango_ds_elements.rc == 0
    - (tango_ds_elements.stdout | from_json).changes | length > 0
  tags: [tango_ds_sardana_elements]

- name: Create what is missing (controllers, elements, measurement groups, environment)
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-sardana-elements]
    stdin: "{{ tango_ds_sardana_elements | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  when:
    - tango_ds_elements.rc == 0
    - (tango_ds_elements.stdout | from_json).changes | length > 0
  changed_when: true
  tags: [tango_ds_sardana_elements]

# --- Ch32: attribute descriptions and alarm levels -----------------------------------------
# Site values for the running devices' attributes, kept in step with
# tango_ds_attribute_config as the Sardana elements are: compare first (read-only, so it
# also runs in check mode and the drift check sees a difference), then write only what
# differs, through the device, which applies it at once and stores it in the database.
- name: Install the attribute configuration script
  ansible.builtin.copy:
    src: tango-ds-attribute-config
    dest: /usr/local/sbin/tango-ds-attribute-config
    owner: root
    group: root
    mode: "0755"
  register: tango_ds_attr_config_script
  tags: [tango_ds_attribute_config]

- name: Compare the attribute descriptions and alarm levels with the running devices
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-attribute-config, --check]
    stdin: "{{ tango_ds_attribute_config | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  register: tango_ds_attr_config
  check_mode: false
  changed_when:
    - ansible_check_mode
    - tango_ds_attr_config.rc == 0
    - (tango_ds_attr_config.stdout | from_json).changes | length > 0
  # In check mode before the first install the script or its interpreter doesn't exist yet.
  failed_when:
    - tango_ds_attr_config.rc | default(1) != 0
    - not (ansible_check_mode and (tango_ds_attr_config_script is changed or
      tango_ds_pkg | default({}) is changed))
  tags: [tango_ds_attribute_config]

- name: Show the attribute configuration differences
  ansible.builtin.debug:
    msg: "{{ (tango_ds_attr_config.stdout | from_json).changes }}"
  when:
    - tango_ds_attr_config.rc == 0
    - (tango_ds_attr_config.stdout | from_json).changes | length > 0
  tags: [tango_ds_attribute_config]

- name: Set what differs (descriptions, warning and alarm levels)
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-ds-attribute-config]
    stdin: "{{ tango_ds_attribute_config | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_ds_tango_host }}"
  when:
    - tango_ds_attr_config.rc == 0
    - (tango_ds_attr_config.stdout | from_json).changes | length > 0
  changed_when: true
  tags: [tango_ds_attribute_config]

# --- Ch35: Part 3's runtime, removed once nothing uses it ----------------------------------
# By here every server runs from the package. What Part 3 ran from goes: PyTango, Sardana
# and the dev tools in the system Python's pip tree (their scripts in /usr/local/bin go
# with them), then pip itself, the checkout, and the readiness helpers the package now
# carries. Each step finds nothing to do on a host built after Ch35.
- name: Look for Part 3's pip distributions
  ansible.builtin.find:
    paths: "{{ tango_ds_legacy_pip_dir }}"
    patterns: "{{ tango_ds_legacy_pip_packages | map('regex_replace', '$', '-*.dist-info') | list }}"
    file_type: directory
  register: tango_ds_legacy_pip

- name: Remove Part 3's PyTango, Sardana and dev tools from the system Python
  ansible.builtin.pip:
    name: "{{ tango_ds_legacy_pip_packages }}"
    state: absent
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  when: tango_ds_legacy_pip.matched > 0

- name: Check that none of them is left
  ansible.builtin.find:
    paths: "{{ tango_ds_legacy_pip_dir }}"
    patterns: "{{ tango_ds_legacy_pip_packages | map('regex_replace', '$', '-*.dist-info') | list }}"
    file_type: directory
  register: tango_ds_legacy_pip_left
  failed_when:
    - tango_ds_legacy_pip_left.matched > 0
    - not ansible_check_mode

- name: Remove pip, which nothing on this host uses any more
  ansible.builtin.apt:
    name: "{{ tango_ds_apt_packages_absent_after_pip }}"
    state: absent

- name: Remove Part 3's checkout of tango-devices
  ansible.builtin.file:
    path: "{{ tango_ds_legacy_code_dir }}"
    state: absent

- name: Remove Part 3's readiness helpers (the package's are in /usr/libexec/beamline-tango)
  ansible.builtin.file:
    path: "/usr/local/sbin/{{ item }}"
    state: absent
  loop: "{{ tango_ds_legacy_sbin }}"

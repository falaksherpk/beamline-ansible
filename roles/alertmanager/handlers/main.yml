---
# handlers file for alertmanager
# Handlers run in the order defined here: systemd rereads the unit before a restart,
# and a configuration reload comes last. A reload with a broken configuration would
# not fail (Alertmanager keeps the old one and logs), which is why the template task
# validates with amtool before the file is installed.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted
  # In check mode a unit that is not installed yet is unknown to systemd; real runs still fail hard.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Reload alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: reloaded
  # In check mode a unit that is not installed yet is unknown to systemd; real runs still fail hard.
  ignore_errors: "{{ ansible_check_mode }}"

---
# Alertmanager (handbook Ch16): the upstream release on obs.beamline, from its release
# tarball pinned by version and SHA-256. Each version has its own directory under
# /opt/alertmanager; /usr/local/bin links to the active one.
- name: Create the cache directory for verified downloads
  ansible.builtin.file:
    path: "{{ alertmanager_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [alertmanager]

- name: Download the Alertmanager release tarball; refused unless its SHA-256 matches
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "{{ alertmanager_download_dir }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ alertmanager_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  # In check mode a not-yet-created directory above is only simulated, so get_url
  # cannot place the file. Real runs still fail hard (missing directory, failed
  # download, checksum mismatch).
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [alertmanager]

- name: Create the directory for this Alertmanager version
  ansible.builtin.file:
    path: "{{ alertmanager_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [alertmanager]

- name: Unpack the verified tarball into the version directory, owned by root
  ansible.builtin.unarchive:
    src: "{{ alertmanager_download_dir }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "{{ alertmanager_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1, --no-same-owner]
    owner: root
    group: root
    creates: "{{ alertmanager_install_dir }}/alertmanager"
  # In check mode the download and the version directory are only simulated.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [alertmanager]

- name: Link the active version's binaries into /usr/local/bin
  ansible.builtin.file:
    src: "{{ alertmanager_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [alertmanager, amtool]
  # In check mode the unpacked binaries do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [alertmanager]

- name: Create the Alertmanager system group
  ansible.builtin.group:
    name: "{{ alertmanager_user }}"
    system: true
  tags: [alertmanager]

- name: Create the Alertmanager system user (no login)
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ alertmanager_data_dir }}"
    create_home: false
  tags: [alertmanager]

- name: Create the data directory (silences, notification state), owned by the server user only
  ansible.builtin.file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0750"
  tags: [alertmanager]

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [alertmanager]

- name: Install the configuration, validated by amtool before it is put in place
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/amtool check-config %s
  notify: Reload alertmanager
  tags: [alertmanager]

- name: Install the systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: [Reload systemd, Restart alertmanager]
  tags: [alertmanager]

- name: Keep Alertmanager enabled and running
  ansible.builtin.systemd_service:
    name: alertmanager
    enabled: true
    state: started
  # In check mode the unit above is only simulated, so systemd does not know it yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [alertmanager]

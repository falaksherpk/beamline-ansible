---
# defaults file for pkg

# Apptainer (Ch15): non-setuid release .deb from GitHub, pinned by version and SHA-256.
# Upgrade = change both values (digest from the release's asset listing).
pkg_apptainer_version: "1.5.4"
pkg_apptainer_sha256: "281cf9bd68f16b6f7c34a3a94d77668bc327b9c09db0412ce7890162734a97f7"

# Web serving (Ch15): nginx on the lab address only, TLS with a lab-CA certificate.
pkg_web_root: /srv/beamline-repo
pkg_web_owner: falak
pkg_web_server_name: pkg.beamline
pkg_web_listen_address: "10.10.10.13"
pkg_web_allowed_cidr: "10.10.10.0/24"
# Certificate and key are read on the controller (admin.beamline), outside Git.
pkg_tls_src_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/lab-ca"

# Signed apt repository (Ch15): reprepro's own state in the owner's home, only the
# published tree under the web root. The signing key is the primary key's fingerprint;
# gpgme signs with its signing subkey, the only secret part present on this host.
pkg_apt_repo_basedir: "/home/{{ pkg_web_owner }}/reprepro"
pkg_apt_repo_outdir: "{{ pkg_web_root }}/apt"
pkg_apt_repo_codename: noble
pkg_apt_repo_signing_key: ECEE314121F9A4EA1CB1A2621AC8A9930C437FCF

# Publishing (Ch15): /usr/local/bin/beamline-publish. The conda channel is indexed
# by a pinned rattler-index build in a throwaway container from a pinned image.
pkg_conda_indexer_image: docker.io/condaforge/miniforge3@sha256:f752860f77bd417aa4db35be3d2e906fdb740fb80f40755ed651fff9e8873aad
pkg_conda_indexer_spec: rattler-index==0.33.1=h91e2699_0

# GitLab Runner (Ch17): one shell-executor runner on this host for beamline-healthcheck's
# pipeline, registered for protected refs only. Same version as GitLab and the runner on
# gitlab.beamline. gitlab-runner hard-depends on gitlab-runner-helper-images of the same
# version (~510 MiB), although the shell executor never uses those images.
pkg_runner_version: "19.4.1-1"
pkg_runner_user: gitlab-runner
# The apt repository is trusted with one key only, files/gitlab-runner-apt.asc:
# GitLab B.V. package repository signing key, F6403F6544A38863DAA0B6E03F01618A51312F3F,
# expires 2028-02-06. On 2026-10-09 it signed the repository's InRelease (gpgv), and
# GitLab's package-signature documentation lists the same fingerprint. The repository's
# InRelease carries no Valid-Until.
pkg_runner_apt_uri: https://packages.gitlab.com/runner/gitlab-runner/ubuntu
pkg_runner_apt_suite: noble
pkg_runner_apt_keyring: /etc/apt/keyrings/gitlab-runner-apt.asc
# Rootless Podman for the runner user: a subordinate UID/GID range of its own, after
# the login user's 100000:65536.
pkg_runner_subid_start: 165536
pkg_runner_subid_count: 65536

# Publishing from CI (Ch17): jobs hand packages over in a drop directory owned by the
# runner user, group-readable by the repository owner (setgid keeps that group), and may
# run only beamline-publish as the owner (sudoers). Linger keeps the owner's runtime
# directory (rootless Podman, gpg-agent) while nobody is logged in.
pkg_publish_dropdir: /var/spool/beamline-publish

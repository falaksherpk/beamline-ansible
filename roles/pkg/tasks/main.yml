---
- name: Install Podman (daemonless, rootless-capable OCI engine; pulls in crun, uidmap, buildah)
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
  tags: [pkg_podman]

- name: Install the Python build toolchain (wheel via python -m build, isolated venvs; Ch15)
  ansible.builtin.apt:
    name:
      - python3-build
      - python3-venv
    state: present
    install_recommends: false
    update_cache: true
  tags: [pkg_build]

- name: Create the cache directory for verified package downloads (Ch15)
  ansible.builtin.file:
    path: /var/cache/beamline-pkg
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [pkg_build]

- name: Download the Apptainer .deb (non-setuid); refused unless its SHA-256 matches (Ch15)
  ansible.builtin.get_url:
    url: "https://github.com/apptainer/apptainer/releases/download/v{{ pkg_apptainer_version }}/apptainer_{{ pkg_apptainer_version }}_amd64.deb"
    dest: "/var/cache/beamline-pkg/apptainer_{{ pkg_apptainer_version }}_amd64.deb"
    checksum: "sha256:{{ pkg_apptainer_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  # In check mode the directory above is only simulated, so get_url cannot place the file.
  # Real runs still fail hard (missing directory, failed download, checksum mismatch).
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [pkg_build]

- name: Install Apptainer from the verified .deb (its postinst loads the AppArmor profile for the starter)
  ansible.builtin.apt:
    deb: "/var/cache/beamline-pkg/apptainer_{{ pkg_apptainer_version }}_amd64.deb"
    state: present
  # In check mode the download above is only simulated, so this file does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [pkg_build]

- name: Install nginx to serve the internal package repository over HTTPS (Ch15)
  ansible.builtin.apt:
    name: nginx
    state: present
    install_recommends: false
    update_cache: true
  tags: [pkg_web]

- name: Create the TLS directory for nginx (root only)
  ansible.builtin.file:
    path: /etc/nginx/tls
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [pkg_web]

- name: Install the lab-CA certificate for the repository host
  ansible.builtin.copy:
    src: "{{ pkg_tls_src_dir }}/{{ pkg_web_server_name }}.crt"
    dest: "/etc/nginx/tls/{{ pkg_web_server_name }}.crt"
    owner: root
    group: root
    mode: "0644"
  notify: [Check nginx configuration, Reload nginx]
  tags: [pkg_web]

- name: Install the private key for the repository host (from the controller, never from Git)
  ansible.builtin.copy:
    src: "{{ pkg_tls_src_dir }}/{{ pkg_web_server_name }}.key"
    dest: "/etc/nginx/tls/{{ pkg_web_server_name }}.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: [Check nginx configuration, Reload nginx]
  tags: [pkg_web]

- name: Create the repository content directories (published by the owner, only read by nginx)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pkg_web_owner }}"
    group: "{{ pkg_web_owner }}"
    mode: "0755"
  loop:
    - "{{ pkg_web_root }}"
    - "{{ pkg_web_root }}/apt"
    - "{{ pkg_web_root }}/conda"
  tags: [pkg_web]

- name: Install the repository site (conf.d drop-in, no symlink needed)
  ansible.builtin.template:
    src: beamline-repo.conf.j2
    dest: /etc/nginx/conf.d/beamline-repo.conf
    owner: root
    group: root
    mode: "0644"
  notify: [Check nginx configuration, Reload nginx]
  tags: [pkg_web]

- name: Disable the default site (plain HTTP on port 80)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: [Check nginx configuration, Reload nginx]
  tags: [pkg_web]

- name: Keep nginx enabled and running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
  tags: [pkg_web]

- name: Allow HTTPS to the repository from the lab network only
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    from_ip: "{{ pkg_web_allowed_cidr }}"
    comment: "beamline package repository (Ch15)"
  tags: [pkg_web]

- name: Install reprepro to maintain the signed apt repository (Ch15)
  ansible.builtin.apt:
    name: reprepro
    state: present
    install_recommends: false
    update_cache: true
  tags: [pkg_apt_repo]

- name: Create reprepro's base, configuration and keyring directories (owner only for the keyring)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ pkg_web_owner }}"
    group: "{{ pkg_web_owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pkg_apt_repo_basedir }}", mode: "0750" }
    - { path: "{{ pkg_apt_repo_basedir }}/conf", mode: "0750" }
    - { path: "{{ pkg_apt_repo_basedir }}/gnupg", mode: "0700" }
  tags: [pkg_apt_repo]

- name: Configure reprepro (distributions, options)
  ansible.builtin.template:
    src: "reprepro-{{ item }}.j2"
    dest: "{{ pkg_apt_repo_basedir }}/conf/{{ item }}"
    owner: "{{ pkg_web_owner }}"
    group: "{{ pkg_web_owner }}"
    mode: "0644"
  loop: [distributions, options]
  tags: [pkg_apt_repo]

- name: Publish the repository's public signing key next to the repository
  ansible.builtin.copy:
    src: beamline-apt-repo.asc
    dest: "{{ pkg_web_root }}/beamline-apt-repo.asc"
    owner: "{{ pkg_web_owner }}"
    group: "{{ pkg_web_owner }}"
    mode: "0644"
  tags: [pkg_apt_repo]

- name: Install the publish script (deb into reprepro, conda into the channel; run as the owner)
  ansible.builtin.template:
    src: beamline-publish.j2
    dest: /usr/local/bin/beamline-publish
    owner: root
    group: root
    mode: "0755"
  tags: [pkg_publish]

- name: Install GitLab's apt repository key for gitlab-runner (fingerprint pinned in defaults; Ch17)
  ansible.builtin.copy:
    src: gitlab-runner-apt.asc
    dest: "{{ pkg_runner_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
  tags: [pkg_runner]

- name: Add the gitlab-runner apt repository (deb822, Signed-By that key only)
  ansible.builtin.template:
    src: gitlab-runner.sources.j2
    dest: /etc/apt/sources.list.d/gitlab-runner.sources
    owner: root
    group: root
    mode: "0644"
  tags: [pkg_runner]

- name: Install gitlab-runner and its helper images at GitLab's version (a hard dependency)
  ansible.builtin.apt:
    name:
      - "gitlab-runner={{ pkg_runner_version }}"
      - "gitlab-runner-helper-images={{ pkg_runner_version }}"
    update_cache: true
  # In check mode the repository above is only simulated, so apt can't find the packages.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [pkg_runner]

- name: Hold the runner packages at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [gitlab-runner, gitlab-runner-helper-images]
  # In check mode the packages aren't installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [pkg_runner]

- name: Give the runner user its own subordinate UID/GID range (rootless Podman)
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    regexp: "^{{ pkg_runner_user }}:"
    line: "{{ pkg_runner_user }}:{{ pkg_runner_subid_start }}:{{ pkg_runner_subid_count }}"
  loop: [subuid, subgid]
  tags: [pkg_runner]

- name: Keep a systemd user manager for the runner user (rootless Podman; jobs have no login)
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ pkg_runner_user }}"
    creates: "/var/lib/systemd/linger/{{ pkg_runner_user }}"
  tags: [pkg_runner]

- name: Keep a systemd user manager for the repository owner (beamline-publish from CI; Ch17)
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ pkg_web_owner }}"
    creates: "/var/lib/systemd/linger/{{ pkg_web_owner }}"
  tags: [pkg_runner]

- name: Create the drop directory for publishing from CI (runner writes, owner's group reads)
  ansible.builtin.file:
    path: "{{ pkg_publish_dropdir }}"
    state: directory
    owner: "{{ pkg_runner_user }}"
    group: "{{ pkg_web_owner }}"
    mode: "2750"
  tags: [pkg_runner]

- name: Let CI jobs run beamline-publish as the repository owner, and nothing else
  ansible.builtin.template:
    src: sudoers-gitlab-runner-publish.j2
    dest: /etc/sudoers.d/gitlab-runner-publish
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  tags: [pkg_runner]

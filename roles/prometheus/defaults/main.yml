---
# defaults file for prometheus (handbook Ch16)

# Upstream LTS release, pinned by version and the SHA-256 of the linux-amd64 tarball.
# The hash agreed in three places on 2026-10-08: GitHub's asset digest, the release's
# sha256sums.txt and prometheus.io/download. Upgrade = change both values.
prometheus_version: "3.13.4"
prometheus_sha256: "87f21a66f96c597a189cef8d640e8921b621fc17a9feff707c332c4f3b3ddd56"
prometheus_install_dir: "/opt/prometheus/{{ prometheus_version }}"
# Verified downloads, kept outside apt's cache (apt-get clean would empty that).
prometheus_download_dir: /var/cache/beamline-pkg

# The server: its own system user, separate from node_exporter's prometheus user.
prometheus_user: prometheus-server
prometheus_data_dir: /var/lib/prometheus-server
prometheus_config_dir: /etc/prometheus
# Backend only: Grafana and Alertmanager on this host use localhost; the web UI is
# reached through an SSH tunnel when needed (ssh -L 9090:localhost:9090 obs.beamline).
prometheus_listen_address: "127.0.0.1:9090"
prometheus_scrape_interval: 15s
# Retention lives in the configuration file: the command-line flags are deprecated in 3.13.
prometheus_retention_time: 30d
prometheus_retention_size: 8GB
# node_exporter runs on every inventory host (role node_exporter) and is scraped by name.
prometheus_node_exporter_port: 9100
# Alertmanager on the same host, loopback only (role alertmanager).
prometheus_alertmanager_address: "127.0.0.1:9093"
# Alert rule files: files/rules/<name>.yml, each with files/tests/<name>.test.yml.
prometheus_rule_files: [beamline-base, beamline-healthcheck]

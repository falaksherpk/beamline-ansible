---
# defaults file for prometheus (handbook Ch16)

# Upstream LTS release, pinned by version and the SHA-256 of the linux-amd64 tarball.
# The hash agreed in three places on 2026-10-08: GitHub's asset digest, the release's
# sha256sums.txt and prometheus.io/download. Upgrade = change both values.
prometheus_version: "3.13.4"
prometheus_sha256: "87f21a66f96c597a189cef8d640e8921b621fc17a9feff707c332c4f3b3ddd56"
prometheus_install_dir: "/opt/prometheus/{{ prometheus_version }}"
# Verified downloads, kept outside apt's cache (apt-get clean would empty that).
prometheus_download_dir: /var/cache/beamline-pkg

# The server: its own system user, separate from node_exporter's prometheus user.
prometheus_user: prometheus-server
prometheus_data_dir: /var/lib/prometheus-server
prometheus_config_dir: /etc/prometheus
# Backend only: Grafana and Alertmanager on this host use localhost; the web UI is
# reached through an SSH tunnel when needed (ssh -L 9090:localhost:9090 obs.beamline).
prometheus_listen_address: "127.0.0.1:9090"
prometheus_scrape_interval: 15s
# Retention lives in the configuration file: the command-line flags are deprecated in 3.13.
prometheus_retention_time: 30d
prometheus_retention_size: 8GB
# node_exporter runs on every inventory host (role node_exporter) and is scraped by name.
prometheus_node_exporter_port: 9100
# Alertmanager on the same host, loopback only (role alertmanager).
prometheus_alertmanager_address: "127.0.0.1:9093"
# Alert rule files: files/rules/<name>.yml, each with files/tests/<name>.test.yml.
prometheus_rule_files: [beamline-base, beamline-healthcheck, beamline-kubernetes]

# GitLab (role gitlab, Ch16): Rails /-/metrics through nginx on 443, TLS verified
# against the lab CA; Workhorse and Gitaly on GitLab's lab address (ports as in
# role gitlab). Every 60 s: at 15 s, GitLab's ~17 000 series would push 30 days
# of data past the 8 GB retention cap.
prometheus_gitlab_scrape_interval: 60s
prometheus_gitlab_ca_file: /usr/local/share/ca-certificates/beamline-ca.crt
prometheus_gitlab_workhorse_port: 9229
prometheus_gitlab_gitaly_port: 9236

# Kubernetes (Ch16): kube-state-metrics through the apiserver's service proxy, and the
# kubelets (/metrics, /metrics/cadvisor) on 10250, as ServiceAccount
# monitoring/prometheus-obs (RBAC in beamline-k8s apps/kube-state-metrics). TLS is
# verified against the cluster CA in files/k8s-cluster-ca.crt (kubeadm's ca.crt, valid
# until 2036; replace it if the cluster is ever re-initialised). The token is created
# and copied by hand (D4); this role only checks that it is there. Every 60 s: about
# 16 300 samples per round (2158 KSM, 3 x ~1630 kubelet, 3 x ~3100 cAdvisor; 2026-10-09).
prometheus_k8s_scrape_interval: 60s
prometheus_k8s_dir: "{{ prometheus_config_dir }}/k8s"
prometheus_k8s_ca_file: "{{ prometheus_k8s_dir }}/cluster-ca.crt"
prometheus_k8s_token_file: "{{ prometheus_k8s_dir }}/prometheus-obs.token"
prometheus_k8s_apiserver: "{{ groups['k8s_control'][0] }}:6443"
prometheus_k8s_kubelet_port: 10250
prometheus_k8s_ksm_path: /api/v1/namespaces/monitoring/services/kube-state-metrics:http-metrics/proxy/metrics

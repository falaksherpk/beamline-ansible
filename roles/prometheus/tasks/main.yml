---
# Prometheus server (handbook Ch16): the upstream LTS release on obs.beamline, from its
# release tarball pinned by version and SHA-256. Each version has its own directory
# under /opt/prometheus; /usr/local/bin links to the active one.
- name: Create the cache directory for verified downloads
  ansible.builtin.file:
    path: "{{ prometheus_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [prometheus]

- name: Download the Prometheus release tarball; refused unless its SHA-256 matches
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ prometheus_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  # In check mode the directory above is only simulated, so get_url cannot place the file.
  # Real runs still fail hard (missing directory, failed download, checksum mismatch).
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [prometheus]

- name: Create the directory for this Prometheus version
  ansible.builtin.file:
    path: "{{ prometheus_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [prometheus]

- name: Unpack the verified tarball into the version directory, owned by root
  ansible.builtin.unarchive:
    src: "{{ prometheus_download_dir }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "{{ prometheus_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1, --no-same-owner]
    owner: root
    group: root
    creates: "{{ prometheus_install_dir }}/prometheus"
  # In check mode the download above is only simulated, so the tarball does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [prometheus]

- name: Link the active version's binaries into /usr/local/bin
  ansible.builtin.file:
    src: "{{ prometheus_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [prometheus, promtool]
  # In check mode the unpacked binaries do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [prometheus]

- name: Create the Prometheus server's system group
  ansible.builtin.group:
    name: "{{ prometheus_user }}"
    system: true
  tags: [prometheus]

- name: Create the Prometheus server's system user (no login; not node_exporter's prometheus user)
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ prometheus_data_dir }}"
    create_home: false
  tags: [prometheus]

- name: Create the TSDB directory, owned by the server user only
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0750"
  tags: [prometheus]

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [prometheus]

- name: Create the directories for alert rules and their unit tests
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [rules, tests]
  tags: [prometheus]

- name: Install the alert rules, validated by promtool before they are put in place
  ansible.builtin.copy:
    src: rules/beamline-base.yml
    dest: "{{ prometheus_config_dir }}/rules/beamline-base.yml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  notify: Reload prometheus
  tags: [prometheus]

- name: Install the alert rules' unit tests
  ansible.builtin.copy:
    src: tests/beamline-base.test.yml
    dest: "{{ prometheus_config_dir }}/tests/beamline-base.test.yml"
    owner: root
    group: root
    mode: "0644"
  tags: [prometheus]

- name: Run the alert rules' unit tests (a failing test fails the play)
  ansible.builtin.command: /usr/local/bin/promtool test rules {{ prometheus_config_dir }}/tests/beamline-base.test.yml
  changed_when: false
  # Read-only, so it also runs in check mode, against the installed files. On a first
  # run in check mode those files are only simulated, so it fails there; real runs
  # still fail hard on any failing test.
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [prometheus]

- name: Install the configuration, validated by promtool before it is put in place
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/local/bin/promtool check config %s
  notify: Reload prometheus
  tags: [prometheus]

- name: Install the systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: [Reload systemd, Restart prometheus]
  tags: [prometheus]

- name: Keep Prometheus enabled and running
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
  # In check mode the unit above is only simulated, so systemd does not know it yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [prometheus]

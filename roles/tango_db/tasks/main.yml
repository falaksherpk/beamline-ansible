# SPDX-License-Identifier: MIT-0
---
# tasks file for tango_db (handbook Part 3, Ch23)
#
# This host runs ONLY the Tango Database (DataBaseds) and its MariaDB backend.
# Device servers, PyTango and the simulators live on tango-ds.beamline (roles/tango_ds).
#
# Check mode works before the first install: the tasks that need the installed packages
# (the two services, the schema query) may fail only while those packages would still be
# installed (failed_when below). A real run fails on any error.

- name: Preseed dbconfig-common's answers for tango-db
  ansible.builtin.debconf:
    name: tango-db
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop: "{{ tango_db_debconf }}"
  loop_control:
    label: "{{ item.question }}"

- name: Install MariaDB (before tango-db, whose postinst needs a running server)
  ansible.builtin.apt:
    name: "{{ tango_db_server_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: tango_db_server_install

- name: Ensure MariaDB is running and enabled
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true
  register: tango_db_mariadb_service
  failed_when:
    - tango_db_mariadb_service is failed
    - not (ansible_check_mode and tango_db_server_install is changed)

- name: Install the Tango Database, the common Tango files and tango_admin
  ansible.builtin.apt:
    name: "{{ tango_db_packages }}"
    state: present
  register: tango_db_install

- name: Ensure the tango-db service is running and enabled
  ansible.builtin.systemd_service:
    name: tango-db
    state: started
    enabled: true
  register: tango_db_service
  failed_when:
    - tango_db_service is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_install is changed))

# The Debian tango-db schema has TIMESTAMP NOT NULL columns without a default. MariaDB
# 10.11 (explicit_defaults_for_timestamp on) gives them none, so the first INSERT that
# omits them fails ("Field 'date' doesn't have a default value"; found in Sept 2026 when
# Sardana wrote memorized-attribute history). Every such column gets
# DEFAULT CURRENT_TIMESTAMP, keeping ON UPDATE where it is set. Plain command + the mariadb
# client over the root socket (written in Ch23). The HDB++ tasks below use community.mysql;
# both, like community.general.ufw, come with Ubuntu's ansible package on admin.
- name: Find TIMESTAMP NOT NULL columns without a default in the Tango schema
  ansible.builtin.command:
    argv:
      - mariadb
      - --batch
      - --skip-column-names
      - --execute
      - >-
        SELECT CONCAT('ALTER TABLE `', TABLE_NAME, '` MODIFY `', COLUMN_NAME,
        '` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP',
        IF(EXTRA LIKE '%on update%', ' ON UPDATE CURRENT_TIMESTAMP', ''))
        FROM information_schema.COLUMNS
        WHERE TABLE_SCHEMA = '{{ tango_db_schema }}' AND DATA_TYPE = 'timestamp'
        AND IS_NULLABLE = 'NO' AND COLUMN_DEFAULT IS NULL
        ORDER BY TABLE_NAME, COLUMN_NAME
  register: tango_db_timestamp_fixes
  changed_when: false
  check_mode: false
  failed_when:
    - tango_db_timestamp_fixes.rc | default(1) != 0
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_install is changed))

- name: Give those columns DEFAULT CURRENT_TIMESTAMP
  ansible.builtin.command:
    argv:
      - mariadb
      - "{{ tango_db_schema }}"
      - --execute
      - "{{ tango_db_timestamp_fixes.stdout_lines | join('; ') }}"
  when:
    - tango_db_timestamp_fixes.rc | default(1) == 0
    - tango_db_timestamp_fixes.stdout_lines | length > 0
  changed_when: true

- name: Allow the Tango Database port from the lab network
  community.general.ufw:
    rule: allow
    port: "{{ tango_db_port | string }}"
    proto: tcp
    from_ip: "{{ tango_db_allowed_from }}"
    comment: Tango Database (DataBaseds), lab network (Ch23)

# HDB++ archive database (handbook Part 3, Ch30): the backend package with its schema
# files, the system user the EventSubscriber runs as, the hdbpp database loaded once from
# the MariaDB schema file, and a unix_socket account for that user. community.mysql
# connects as root over the socket and needs PyMySQL here. The HDB++ packages are pinned
# (defaults); the cache is refreshed here every run, since the first install task above
# keeps a cache up to an hour old, which may predate a build just published.
- name: Install the HDB++ MySQL backend (schema files) and PyMySQL
  ansible.builtin.apt:
    name: "{{ tango_db_hdbpp_packages }}"
    state: present
    update_cache: true
  register: tango_db_hdbpp_install
  tags: [tango_db_hdbpp]

- name: Create the system user the HDB++ EventSubscriber runs as
  ansible.builtin.user:
    name: "{{ tango_db_hdbpp_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  tags: [tango_db_hdbpp]

- name: Create the HDB++ database
  community.mysql.mysql_db:
    name: "{{ tango_db_hdbpp_schema }}"
    state: present
    login_unix_socket: "{{ tango_db_mysql_socket }}"
  register: tango_db_hdbpp_db
  failed_when:
    - tango_db_hdbpp_db is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

- name: Check whether the HDB++ schema is loaded
  community.mysql.mysql_query:
    login_unix_socket: "{{ tango_db_mysql_socket }}"
    query: >-
      SELECT COUNT(*) AS n FROM information_schema.TABLES
      WHERE TABLE_SCHEMA = %s AND TABLE_NAME = 'att_conf'
    positional_args: ["{{ tango_db_hdbpp_schema }}"]
  register: tango_db_hdbpp_schema_check
  changed_when: false
  check_mode: false
  failed_when:
    - tango_db_hdbpp_schema_check is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

# The schema file starts with DROP TABLE IF EXISTS for every table: it runs only into an
# empty database, never again.
- name: Load the HDB++ schema into the empty database
  community.mysql.mysql_db:
    name: "{{ tango_db_hdbpp_schema }}"
    state: import
    target: "{{ tango_db_hdbpp_schema_file }}"
    login_unix_socket: "{{ tango_db_mysql_socket }}"
  register: tango_db_hdbpp_schema_load
  when: >-
    (tango_db_hdbpp_schema_check.query_result | default([[{'n': 0}]]))[0][0].n | int == 0
  failed_when:
    - tango_db_hdbpp_schema_load is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

- name: Give the HDB++ user its unix_socket account and privileges
  community.mysql.mysql_user:
    name: "{{ tango_db_hdbpp_user }}"
    host: localhost
    plugin: unix_socket
    priv: "{{ tango_db_hdbpp_schema }}.*:{{ tango_db_hdbpp_privileges }}"
    state: present
    login_unix_socket: "{{ tango_db_mysql_socket }}"
  register: tango_db_hdbpp_account
  failed_when:
    - tango_db_hdbpp_account is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

# The MariaDB schema file creates att_history.time as DATETIME(3), but libhdb++mysql
# 7.2.0 writes NOW(6) into it: an attribute's add and start events, a few hundred
# microseconds apart, round to the same millisecond and the second fails with "1062
# Duplicate entry" (found in Ch30). DATETIME(6) keeps the table's RANGE COLUMNS(time)
# partitions and its rows. Compare first (read-only, also in check mode, where a
# difference is reported as the change a real run would make), then alter only if needed.
- name: Check the precision of att_history.time in the HDB++ schema
  community.mysql.mysql_query:
    login_unix_socket: "{{ tango_db_mysql_socket }}"
    query: >-
      SELECT COLUMN_TYPE AS t FROM information_schema.COLUMNS
      WHERE TABLE_SCHEMA = %s AND TABLE_NAME = 'att_history' AND COLUMN_NAME = 'time'
    positional_args: ["{{ tango_db_hdbpp_schema }}"]
  register: tango_db_hdbpp_history_time
  check_mode: false
  changed_when:
    - ansible_check_mode
    - tango_db_hdbpp_history_time_type == 'datetime(3)'
  failed_when:
    - tango_db_hdbpp_history_time is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  vars:
    tango_db_hdbpp_history_time_type: >-
      {{ ((tango_db_hdbpp_history_time.query_result | default([[]]))[0] | first | default({})).t | default('') }}
  tags: [tango_db_hdbpp]

- name: Store microseconds in att_history.time (DATETIME(6))
  community.mysql.mysql_query:
    login_unix_socket: "{{ tango_db_mysql_socket }}"
    login_db: "{{ tango_db_hdbpp_schema }}"
    query: ALTER TABLE att_history MODIFY time DATETIME(6) NOT NULL
  when: >-
    ((tango_db_hdbpp_history_time.query_result | default([[]]))[0] | first | default({})).t
    | default('') == 'datetime(3)'
  tags: [tango_db_hdbpp]

# --- Ch30: registration of the HDB++ servers ---------------------------------------------
# As roles/tango_ds does for the lab devices (Ch29): compare first (read-only, so it also
# runs in check mode, where a difference is reported as the change a real run would make),
# then write only what differs.
- name: Install the HDB++ servers and PyTango (for the registration script)
  ansible.builtin.apt:
    name: "{{ tango_db_hdbpp_server_packages }}"
    state: present
    update_cache: true
  register: tango_db_hdbpp_server_install
  tags: [tango_db_hdbpp_register]

- name: Install the registration script
  ansible.builtin.copy:
    src: tango-db-register
    dest: /usr/local/sbin/tango-db-register
    owner: root
    group: root
    mode: "0755"
  register: tango_db_register_script
  tags: [tango_db_hdbpp_register]

- name: Compare the HDB++ server registrations with the Tango database
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-db-register, --check]
    stdin: "{{ tango_db_hdbpp_servers | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_db_tango_host }}"
  register: tango_db_hdbpp_registration
  check_mode: false
  changed_when:
    - ansible_check_mode
    - tango_db_hdbpp_registration.rc == 0
    - (tango_db_hdbpp_registration.stdout | from_json).changes | length > 0
  # In check mode before the first install the script or PyTango isn't there yet.
  failed_when:
    - tango_db_hdbpp_registration.rc | default(1) != 0
    - not (ansible_check_mode and (tango_db_register_script is changed or tango_db_hdbpp_server_install is changed))
  tags: [tango_db_hdbpp_register]

- name: Show the HDB++ registration differences
  ansible.builtin.debug:
    msg: "{{ (tango_db_hdbpp_registration.stdout | from_json).changes }}"
  when:
    - tango_db_hdbpp_registration.rc == 0
    - (tango_db_hdbpp_registration.stdout | from_json).changes | length > 0
  tags: [tango_db_hdbpp_register]

- name: Register what differs (HDB++ servers, devices, properties)
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-db-register]
    stdin: "{{ tango_db_hdbpp_servers | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_db_tango_host }}"
  when:
    - tango_db_hdbpp_registration.rc == 0
    - (tango_db_hdbpp_registration.stdout | from_json).changes | length > 0
  changed_when: true
  register: tango_db_hdbpp_registration_write
  tags: [tango_db_hdbpp_register]

# --- Ch30: the HDB++ servers as services --------------------------------------------------
# One unit per server from one template, grouped under hdbpp.target, as roles/tango_ds does
# for the lab devices (Ch29). systemd is told about changed units by an explicit task here
# rather than a handler.
- name: Install the readiness helper the HDB++ units call from ExecStartPost
  ansible.builtin.copy:
    src: tango-db-wait
    dest: /usr/local/sbin/tango-db-wait
    owner: root
    group: root
    mode: "0755"
  tags: [tango_db_hdbpp_services]

- name: Install the target that groups the HDB++ units
  ansible.builtin.template:
    src: hdbpp.target.j2
    dest: /etc/systemd/system/hdbpp.target
    owner: root
    group: root
    mode: "0644"
  register: tango_db_hdbpp_target_file
  tags: [tango_db_hdbpp_services]

- name: Install the HDB++ server units
  ansible.builtin.template:
    src: hdbpp-unit.service.j2
    dest: "/etc/systemd/system/hdbpp-{{ unit.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ tango_db_hdbpp_servers }}"
  loop_control:
    loop_var: unit
    label: "hdbpp-{{ unit.name }}"
  register: tango_db_hdbpp_units
  tags: [tango_db_hdbpp_services]

# The firewall opens each kind of port as one range; a gap or a duplicate would open a
# port no server owns, or leave one closed.
- name: Check that each kind of HDB++ port forms one contiguous block
  ansible.builtin.assert:
    that:
      - ports | unique | length == tango_db_hdbpp_servers | length
      - (ports | max) - (ports | min) + 1 == tango_db_hdbpp_servers | length
    fail_msg: "{{ kind }} ports {{ ports | sort }} are not one contiguous block"
    quiet: true
  vars:
    ports: "{{ tango_db_hdbpp_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_db_hdbpp_firewall]

- name: Open the HDB++ servers' fixed ports to the lab network
  community.general.ufw:
    rule: allow
    port: "{{ ports | min }}:{{ ports | max }}"
    proto: tcp
    from_ip: "{{ tango_db_allowed_from }}"
    comment: "HDB++ servers, {{ kind }} ports, lab network (Ch30)"
  vars:
    ports: "{{ tango_db_hdbpp_servers | map(attribute='ports.' ~ kind) | list }}"
  loop: [corba, heartbeat, event]
  loop_control:
    loop_var: kind
  tags: [tango_db_hdbpp_firewall]

- name: Make systemd read the new and changed HDB++ units now
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: tango_db_hdbpp_target_file is changed or tango_db_hdbpp_units is changed
  tags: [tango_db_hdbpp_services]

- name: Enable both HDB++ units, so the target starts them at boot
  ansible.builtin.systemd_service:
    name: "hdbpp-{{ unit }}.service"
    enabled: true
  loop: "{{ tango_db_hdbpp_servers | map(attribute='name') | list }}"
  loop_control:
    loop_var: unit
  # In check mode the units above are only simulated, so systemd doesn't know them yet.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_db_hdbpp_services]

- name: Keep the HDB++ target enabled and started (starts both units, ES first)
  ansible.builtin.systemd_service:
    name: hdbpp.target
    enabled: true
    state: started
  register: tango_db_hdbpp_target
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_db_hdbpp_services]

# Units already running pick up a changed unit file, changed registration properties, or
# upgraded HDB++ packages (both servers: the EventSubscriber loads the backend library,
# both link libtango and libhdb++) only at a restart. Only when the target task succeeded
# without starting anything: if it has just started the units they are fresh, and if it
# failed (check mode before the first install) there is nothing to restart.
- name: Restart the HDB++ servers whose unit file, registration or packages changed
  ansible.builtin.systemd_service:
    name: "hdbpp-{{ item.unit.name }}.service"
    state: restarted
  loop: "{{ tango_db_hdbpp_units.results }}"
  loop_control:
    label: "hdbpp-{{ item.unit.name }}"
  vars:
    packages_changed: >-
      {{ tango_db_hdbpp_install | default({}) is changed
      or tango_db_hdbpp_server_install | default({}) is changed }}
    registration_written: "{{ tango_db_hdbpp_registration_write | default({}) is changed }}"
    registration_changes: "{{ (tango_db_hdbpp_registration.stdout | default('{}') | from_json).changes | default([]) }}"
  when:
    - >-
      item is changed or packages_changed or (registration_written and
      registration_changes | select('match', item.unit.device ~ ':') | list | length > 0)
    - tango_db_hdbpp_target is succeeded
    - tango_db_hdbpp_target is not changed
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [tango_db_hdbpp_services]

# --- Ch30: what is archived -----------------------------------------------------------------
# files/tango-db-archive keeps the EventSubscriber's attributes in step with
# tango_db_hdbpp_archive, after the servers are up: compare first (read-only, so it also
# runs in check mode, where a difference is reported as the change a real run would make),
# then write only what differs. Archived attributes not in the list are shown, never
# removed. The devices are on tango-ds: they must be running for either step.
- name: Install the archive script
  ansible.builtin.copy:
    src: tango-db-archive
    dest: /usr/local/sbin/tango-db-archive
    owner: root
    group: root
    mode: "0755"
  register: tango_db_archive_script
  tags: [tango_db_hdbpp_archive]

- name: Compare the archived attributes with the list
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-db-archive, --check]
    stdin: "{{ tango_db_hdbpp_archive_spec | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_db_tango_host }}"
  register: tango_db_hdbpp_archive_state
  check_mode: false
  changed_when:
    - ansible_check_mode
    - tango_db_hdbpp_archive_state.rc == 0
    - (tango_db_hdbpp_archive_state.stdout | from_json).changes | length > 0
  # In check mode before the first install the script, PyTango or the servers aren't there yet.
  failed_when:
    - tango_db_hdbpp_archive_state.rc | default(1) != 0
    - not (ansible_check_mode and (tango_db_archive_script is changed or tango_db_hdbpp_server_install is changed))
  tags: [tango_db_hdbpp_archive]

- name: Show the archive differences, and archived attributes not in the list
  ansible.builtin.debug:
    msg: "{{ state | dict2items | selectattr('key', 'in', ['changes', 'unlisted'])
             | selectattr('value') | items2dict }}"
  vars:
    state: "{{ tango_db_hdbpp_archive_state.stdout | from_json }}"
  when:
    - tango_db_hdbpp_archive_state.rc == 0
    - (state.changes + state.unlisted) | length > 0
  tags: [tango_db_hdbpp_archive]

- name: Archive what differs (add through the ConfigurationManager, or correct on the device)
  ansible.builtin.command:
    argv: [/usr/local/sbin/tango-db-archive]
    stdin: "{{ tango_db_hdbpp_archive_spec | to_json }}"
  environment:
    TANGO_HOST: "{{ tango_db_tango_host }}"
  when:
    - tango_db_hdbpp_archive_state.rc == 0
    - (tango_db_hdbpp_archive_state.stdout | from_json).changes | length > 0
  changed_when: true
  tags: [tango_db_hdbpp_archive]

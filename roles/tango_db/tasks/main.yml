---
# tasks file for tango_db (handbook Part 3, Ch23)
#
# This host runs ONLY the Tango Database (DataBaseds) and its MariaDB backend.
# Device servers, PyTango and the simulators live on tango-ds.beamline (roles/tango_ds).
#
# Check mode works before the first install: the tasks that need the installed packages
# (the two services, the schema query) may fail only while those packages would still be
# installed (failed_when below). A real run fails on any error.

- name: Preseed dbconfig-common's answers for tango-db
  ansible.builtin.debconf:
    name: tango-db
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop: "{{ tango_db_debconf }}"
  loop_control:
    label: "{{ item.question }}"

- name: Install MariaDB (before tango-db, whose postinst needs a running server)
  ansible.builtin.apt:
    name: "{{ tango_db_server_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: tango_db_server_install

- name: Ensure MariaDB is running and enabled
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true
  register: tango_db_mariadb_service
  failed_when:
    - tango_db_mariadb_service is failed
    - not (ansible_check_mode and tango_db_server_install is changed)

- name: Install the Tango Database, the common Tango files and tango_admin
  ansible.builtin.apt:
    name: "{{ tango_db_packages }}"
    state: present
  register: tango_db_install

- name: Ensure the tango-db service is running and enabled
  ansible.builtin.systemd_service:
    name: tango-db
    state: started
    enabled: true
  register: tango_db_service
  failed_when:
    - tango_db_service is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_install is changed))

# The Debian tango-db schema has TIMESTAMP NOT NULL columns without a default. MariaDB
# 10.11 (explicit_defaults_for_timestamp on) gives them none, so the first INSERT that
# omits them fails ("Field 'date' doesn't have a default value"; found in Sept 2026 when
# Sardana wrote memorized-attribute history). Every such column gets
# DEFAULT CURRENT_TIMESTAMP, keeping ON UPDATE where it is set. Plain command + the mariadb
# client over the root socket (written in Ch23). The HDB++ tasks below use community.mysql;
# both, like community.general.ufw, come with Ubuntu's ansible package on admin.
- name: Find TIMESTAMP NOT NULL columns without a default in the Tango schema
  ansible.builtin.command:
    argv:
      - mariadb
      - --batch
      - --skip-column-names
      - --execute
      - >-
        SELECT CONCAT('ALTER TABLE `', TABLE_NAME, '` MODIFY `', COLUMN_NAME,
        '` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP',
        IF(EXTRA LIKE '%on update%', ' ON UPDATE CURRENT_TIMESTAMP', ''))
        FROM information_schema.COLUMNS
        WHERE TABLE_SCHEMA = '{{ tango_db_schema }}' AND DATA_TYPE = 'timestamp'
        AND IS_NULLABLE = 'NO' AND COLUMN_DEFAULT IS NULL
        ORDER BY TABLE_NAME, COLUMN_NAME
  register: tango_db_timestamp_fixes
  changed_when: false
  check_mode: false
  failed_when:
    - tango_db_timestamp_fixes.rc | default(1) != 0
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_install is changed))

- name: Give those columns DEFAULT CURRENT_TIMESTAMP
  ansible.builtin.command:
    argv:
      - mariadb
      - "{{ tango_db_schema }}"
      - --execute
      - "{{ tango_db_timestamp_fixes.stdout_lines | join('; ') }}"
  when:
    - tango_db_timestamp_fixes.rc | default(1) == 0
    - tango_db_timestamp_fixes.stdout_lines | length > 0
  changed_when: true

- name: Allow the Tango Database port from the lab network
  community.general.ufw:
    rule: allow
    port: "{{ tango_db_port | string }}"
    proto: tcp
    from_ip: "{{ tango_db_allowed_from }}"
    comment: Tango Database (DataBaseds), lab network (Ch23)

# HDB++ archive database (handbook Part 3, Ch30): the backend package with its schema
# files, the system user the EventSubscriber runs as, the hdbpp database loaded once from
# the MariaDB schema file, and a unix_socket account for that user. community.mysql
# connects as root over the socket and needs PyMySQL here.
- name: Install the HDB++ MySQL backend (schema files) and PyMySQL
  ansible.builtin.apt:
    name: "{{ tango_db_hdbpp_packages }}"
    state: present
  register: tango_db_hdbpp_install
  tags: [tango_db_hdbpp]

- name: Create the system user the HDB++ EventSubscriber runs as
  ansible.builtin.user:
    name: "{{ tango_db_hdbpp_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  tags: [tango_db_hdbpp]

- name: Create the HDB++ database
  community.mysql.mysql_db:
    name: "{{ tango_db_hdbpp_schema }}"
    state: present
    login_unix_socket: "{{ tango_db_mysql_socket }}"
  register: tango_db_hdbpp_db
  failed_when:
    - tango_db_hdbpp_db is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

- name: Check whether the HDB++ schema is loaded
  community.mysql.mysql_query:
    login_unix_socket: "{{ tango_db_mysql_socket }}"
    query: >-
      SELECT COUNT(*) AS n FROM information_schema.TABLES
      WHERE TABLE_SCHEMA = %s AND TABLE_NAME = 'att_conf'
    positional_args: ["{{ tango_db_hdbpp_schema }}"]
  register: tango_db_hdbpp_schema_check
  changed_when: false
  check_mode: false
  failed_when:
    - tango_db_hdbpp_schema_check is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

# The schema file starts with DROP TABLE IF EXISTS for every table: it runs only into an
# empty database, never again.
- name: Load the HDB++ schema into the empty database
  community.mysql.mysql_db:
    name: "{{ tango_db_hdbpp_schema }}"
    state: import
    target: "{{ tango_db_hdbpp_schema_file }}"
    login_unix_socket: "{{ tango_db_mysql_socket }}"
  register: tango_db_hdbpp_schema_load
  when: >-
    (tango_db_hdbpp_schema_check.query_result | default([[{'n': 0}]]))[0][0].n | int == 0
  failed_when:
    - tango_db_hdbpp_schema_load is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

- name: Give the HDB++ user its unix_socket account and privileges
  community.mysql.mysql_user:
    name: "{{ tango_db_hdbpp_user }}"
    host: localhost
    plugin: unix_socket
    priv: "{{ tango_db_hdbpp_schema }}.*:{{ tango_db_hdbpp_privileges }}"
    state: present
    login_unix_socket: "{{ tango_db_mysql_socket }}"
  register: tango_db_hdbpp_account
  failed_when:
    - tango_db_hdbpp_account is failed
    - not (ansible_check_mode and (tango_db_server_install is changed or tango_db_hdbpp_install is changed))
  tags: [tango_db_hdbpp]

---
# defaults file for tango_db (handbook Part 3, Ch23)

# MariaDB first, in its own task: tango-db's postinst runs dbconfig-common, which
# needs a running server. tango_admin is in libtango-tools, not tango-common.
tango_db_server_packages:
  - mariadb-server
tango_db_packages:
  # Named explicitly: tango-db depends on "dbconfig-mysql | dbconfig-no-thanks", and with
  # MariaDB already installed apt picks dbconfig-no-thanks, which skips the database
  # setup entirely (seen in the Ch23 sandbox test).
  - dbconfig-mysql
  - tango-db
  - tango-common
  - libtango-tools

# dbconfig-common's answers for tango-db (version 2.0.24 templates; these equal its
# defaults, preseeded so the outcome is stated here). The application password is
# left unset on purpose: dbconfig then generates one (12 random alphanumerics) and
# writes it to /var/lib/tango/.my.cnf (mode 600). Admin access is root over the socket.
tango_db_debconf:
  - { question: tango-db/dbconfig-install, vtype: boolean, value: "true" }
  - { question: tango-db/database-type, vtype: select, value: mysql }
  - { question: tango-db/mysql/method, vtype: select, value: Unix socket }

# The database's MariaDB schema, and who may reach DataBaseds.
tango_db_schema: tango
tango_db_port: 10000
tango_db_allowed_from: 10.10.10.0/24

# HDB++ archive database (handbook Part 3, Ch30). The schema file comes from our
# libhdb++mysql7 package (beamline-hdbpp); of its MariaDB/MySQL InnoDB files only
# create_hdb++_mariadb_innodb.sql loads on MariaDB 10.11 (the MySQL JSON variant stops
# with ERROR 1074). The EventSubscriber runs on this host as the system user named in
# tango_db_hdbpp_user and logs in over the socket with unix_socket authentication:
# no password exists anywhere (LibConfiguration carries an empty "password=").
tango_db_hdbpp_packages:
  - libhdb++mysql7
  - python3-pymysql
tango_db_hdbpp_schema: hdbpp
tango_db_hdbpp_schema_file: /usr/share/libhdb++mysql7/sql/create_hdb++_mariadb_innodb.sql
tango_db_hdbpp_user: hdbpp
tango_db_hdbpp_privileges: SELECT,INSERT,UPDATE
tango_db_mysql_socket: /run/mysqld/mysqld.sock

# --- Ch30: the HDB++ servers -------------------------------------------------------------
# The ConfigurationManager and the EventSubscriber run on this host, next to MariaDB, as
# tango_db_hdbpp_user (the EventSubscriber's unix_socket identity; the ConfigurationManager
# never opens the archive database in hdbpp-cm 2.2.2). python3-tango is Ubuntu's PyTango
# for this host's cppTango 9.5.0, for files/tango-db-register only.
tango_db_hdbpp_server_packages:
  - hdbpp-es
  - hdbpp-cm
  - python3-tango
tango_db_tango_host: "{{ inventory_hostname }}:{{ tango_db_port }}"
# One entry per server, as tango_ds_servers in roles/tango_ds: registration
# (files/tango-db-register) and a unit, hdbpp-<name>.service (templates/hdbpp-unit.service.j2).
# Ports: CORBA (-ORBendPoint), ZeroMQ heartbeat and ZeroMQ event, the next free last digits
# after tango-ds's 68-72, on this host's lab address; each kind one contiguous block,
# opened in ufw as a range. after: units started first (Wants= + After=); no BindsTo=, so
# a MariaDB or DataBaseds restart doesn't restart the servers (the backend reconnects).
# Property values are strings, or lists of strings for properties
# holding several. Unlisted properties stay as they are: the EventSubscriber's
# AttributeList belongs to it (the ConfigurationManager's AttributeAdd writes it).
# LibConfiguration's empty password is deliberate: unix_socket ignores it, and the backend
# refuses to start without the key. ArchiverList holds plain device names; the
# ConfigurationManager prefixes tango://$TANGO_HOST/ itself.
tango_db_hdbpp_servers:
  - name: es
    server: hdb++es-srv/01
    class: HdbEventSubscriber
    device: archiving/hdbpp/eventsubscriber01
    binary: /usr/bin/hdb++es-srv
    ports: {corba: 28374, heartbeat: 28474, event: 28574}
    after: [mariadb, tango-db]
    properties:
      LibConfiguration:
        - libname=libhdb++mysql.so.7
        - host=localhost
        - "user={{ tango_db_hdbpp_user }}"
        - password=
        - "dbname={{ tango_db_hdbpp_schema }}"
        - port=3306
  - name: cm
    server: hdb++cm-srv/01
    class: HdbConfigurationManager
    device: archiving/hdbpp/confmanager01
    binary: /usr/bin/hdb++cm-srv
    ports: {corba: 28373, heartbeat: 28473, event: 28573}
    after: [tango-db, hdbpp-es]
    properties:
      ArchiverList:
        - archiving/hdbpp/eventsubscriber01

# -ORBendPoint's host: the servers bind to this name's lab address and publish it.
tango_db_endpoint_host: "{{ inventory_hostname }}"
# Tango's console log level for the servers (4 = info), into the journal.
tango_db_hdbpp_log_level: 4
# At most two starts per 10 s, under systemd's default start limit (5 in 10 s).
tango_db_hdbpp_restart_sec: 5

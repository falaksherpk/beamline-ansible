---
# NVIDIA driver on the GPU node (handbook Part 2, Ch19). Step A: the driver itself
# (tag nvidia_driver). Check mode works before the first install: the two checks that
# need the driver are allowed to fail only while the packages would still be installed.

- name: Read the PCI devices from NVIDIA (vendor 10de)
  ansible.builtin.command:
    cmd: lspci -n -d '10de:'
  register: nvidia_lspci
  changed_when: false
  check_mode: false
  tags: [nvidia_driver]

- name: Refuse unless the passed-through GPU is present and the kernel is a generic flavour
  ansible.builtin.assert:
    that:
      - nvidia_lspci.stdout is search(' ' ~ nvidia_gpu_pci_id ~ '( |$)', multiline=True)
      - ansible_facts['kernel'] is search('-generic$')
    fail_msg: >-
      need {{ nvidia_gpu_pci_id }} on the PCI bus (lspci -n -d 10de: shows
      '{{ nvidia_lspci.stdout }}') and a -generic kernel (running {{ ansible_facts['kernel'] }})
    quiet: true
  tags: [nvidia_driver]

- name: Install the driver (prebuilt kernel modules, headless userspace, nvidia-smi)
  ansible.builtin.apt:
    name: "{{ nvidia_packages }}"
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
  register: nvidia_install
  tags: [nvidia_driver]

# udev loads the module at every later boot; this covers the first install without a reboot.
- name: Load the nvidia kernel module
  ansible.builtin.command:
    cmd: modprobe nvidia
    creates: /sys/module/nvidia
  tags: [nvidia_driver]

- name: Read the GPU as the driver sees it
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=name,driver_version,pci.bus_id --format=csv,noheader
  register: nvidia_smi
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode and nvidia_install is changed }}"
  tags: [nvidia_driver]

- name: Check that the driver drives the passed-through GPU on the expected branch
  ansible.builtin.assert:
    that:
      - nvidia_smi.stdout is search(nvidia_gpu_name)
      - nvidia_smi.stdout is search(', ' ~ nvidia_driver_branch ~ '\.')
    fail_msg: "nvidia-smi: '{{ nvidia_smi.stdout | default('') }}{{ nvidia_smi.stderr | default('') }}'"
    quiet: true
  ignore_errors: "{{ ansible_check_mode and nvidia_install is changed }}"
  tags: [nvidia_driver]

# Step B (tag nvidia_persistence): persistence mode on, so the GPU stays initialised
# between jobs. nvidia-persistenced is started by udev (71-nvidia.rules) when the nvidia
# driver binds; the packaged ExecStart passes --no-persistence-mode, the drop-in drops it.
- name: Create the drop-in directory for nvidia-persistenced
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [nvidia_persistence]

- name: Install the persistence-mode drop-in
  ansible.builtin.template:
    src: nvidia-persistenced-persistence-mode.conf.j2
    dest: /etc/systemd/system/nvidia-persistenced.service.d/persistence-mode.conf
    owner: root
    group: root
    mode: "0644"
  register: nvidia_persistence_dropin
  notify: Restart nvidia-persistenced
  tags: [nvidia_persistence]

- name: Restart nvidia-persistenced now if the drop-in changed
  ansible.builtin.meta: flush_handlers
  tags: [nvidia_persistence]

- name: Read the persistence mode
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=persistence_mode --format=csv,noheader
  register: nvidia_persistence_mode
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode and ((nvidia_install | default({})) is changed or (nvidia_persistence_dropin | default({})) is changed) }}"
  tags: [nvidia_persistence]

- name: Check that persistence mode is on
  ansible.builtin.assert:
    that:
      - nvidia_persistence_mode.stdout | trim == 'Enabled'
    fail_msg: "nvidia-smi persistence_mode: '{{ nvidia_persistence_mode.stdout | default('') }}'"
    quiet: true
  ignore_errors: "{{ ansible_check_mode and ((nvidia_install | default({})) is changed or (nvidia_persistence_dropin | default({})) is changed) }}"
  tags: [nvidia_persistence]

# Step C (tag nvidia_updates): keep the kernel and the driver out of unattended-upgrades.
# Every other security update stays automatic.
- name: Keep the kernel and the NVIDIA driver out of unattended-upgrades
  ansible.builtin.template:
    src: 51unattended-upgrades-nvidia.j2
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-nvidia
    owner: root
    group: root
    mode: "0644"
  tags: [nvidia_updates]

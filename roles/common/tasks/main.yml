---
- name: Set timezone to UTC
  community.general.timezone:
    name: Etc/UTC

- name: Ensure baseline packages are installed
  ansible.builtin.apt:
    name:
      - chrony
      - ufw
      - curl
      - gnupg2
      - ca-certificates
      - htop
      - vim
      - git
      - net-tools
      - tree
      - wget
      - dnsutils
      - bash-completion
      - jq
    state: present
    update_cache: true

- name: Ensure chrony (NTP) is running and enabled
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Deploy /etc/hosts from template (lab-wide roster, no duplicate hostname entries)
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Enable color prompt in .bashrc
  ansible.builtin.lineinfile:
    path: "/home/falak/.bashrc"
    regexp: '^#force_color_prompt=yes'
    line: force_color_prompt=yes
  become: false

- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable firewall (default-deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Install the lab's self-signed CA certificate into the system trust store
  ansible.builtin.copy:
    src: beamline-ca.crt
    dest: /usr/local/share/ca-certificates/beamline-ca.crt
    mode: '0644'
  notify: Update CA certificates
  tags: [ca_trust]

- name: Install the internal apt repository's signing key (scoped to that repository by Signed-By)
  ansible.builtin.copy:
    src: beamline-apt-repo.asc
    dest: /etc/apt/keyrings/beamline-apt-repo.asc
    mode: '0644'
  notify: Update apt cache
  tags: [common_beamline_repo]

- name: Add the internal apt repository on pkg.beamline (deb822)
  ansible.builtin.template:
    src: beamline.sources.j2
    dest: /etc/apt/sources.list.d/beamline.sources
    mode: '0644'
  notify: Update apt cache
  tags: [common_beamline_repo]

- name: Make a kernel oops panic, and a panic reboot (F3, Part 4 Ch39 Case 3)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-beamline-panic.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ common_panic_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  tags: [common_panic]

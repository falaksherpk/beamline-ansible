---
# Chapter 13 — Kubernetes nodes (k8cp, k8w1, k8w2).
# Fact-free by design: plays run with narrow --tags skip fact gathering
# (Ch12 finding), so no task here may depend on ansible_facts.

- name: Enable IPv4 forwarding (the Kubernetes 1.36 runtime prerequisite)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    reload: true
    state: present
  tags: [k8s_prereq]

- name: Install containerd (Ubuntu package; pulls in runc)
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [k8s_containerd]

- name: Ensure containerd's drop-in directory exists
  ansible.builtin.file:
    path: /etc/containerd/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s_containerd]

- name: Write a minimal containerd main config that activates conf.d drop-ins
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (beamline-ansible, role k8s, Chapter 13).
      # containerd only resolves the imports listed in a config file it
      # actually loads; the default shown by `containerd config dump` is
      # never acted on by itself (Chapter 13 finding). Settings go in conf.d.
      version = 3
      imports = ["/etc/containerd/conf.d/*.toml"]
  notify: Restart containerd
  tags: [k8s_containerd]

- name: Configure containerd for Kubernetes (systemd cgroups, kubeadm's pause image)
  ansible.builtin.template:
    src: 10-kubernetes.toml.j2
    dest: /etc/containerd/conf.d/10-kubernetes.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd
  tags: [k8s_containerd]

- name: Add the Kubernetes apt repository for the chosen minor (pkgs.k8s.io)
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/"
    suites: ["/"]
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    state: present
  register: k8s_repo
  tags: [k8s_packages]

- name: Refresh the apt cache when the repository was added or changed
  ansible.builtin.apt:
    update_cache: true
  when: k8s_repo is changed
  tags: [k8s_packages]

- name: Install kubeadm, kubelet and kubectl at the pinned version, plus cri-tools
  ansible.builtin.apt:
    name:
      - "kubeadm={{ k8s_package_version }}"
      - "kubelet={{ k8s_package_version }}"
      - "kubectl={{ k8s_package_version }}"
      - cri-tools
    state: present
  tags: [k8s_packages]

- name: Hold kubeadm, kubelet and kubectl so apt never upgrades them implicitly
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubeadm, kubelet, kubectl]
  tags: [k8s_packages]

# No ufw rule for NodePorts (Chapter 14): kube-proxy DNATs NodePort traffic in
# PREROUTING, so it is forwarded (Calico and kube-proxy chains run ahead of ufw's)
# and never reaches INPUT, where a ufw allow/deny would apply. NodePorts are
# restricted by kube-proxy's nodePortAddresses instead (kubeadm-init.yaml.j2).
- name: Allow Kubernetes node traffic from the lab subnet only (all nodes)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ k8s_lab_subnet }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "10250", proto: tcp, comment: "k8s kubelet API" }
    - { port: "4789", proto: udp, comment: "Calico VXLAN" }
    - { port: "5473", proto: tcp, comment: "Calico Typha" }
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"
  tags: [k8s_firewall]

- name: Allow the Kubernetes API server from the lab subnet only (control plane)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    from_ip: "{{ k8s_lab_subnet }}"
    comment: "k8s API server"
  when: "'k8s_control' in group_names"
  tags: [k8s_firewall]

- name: Render the kubeadm init configuration (control plane; kubeadm init itself is run by hand)
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0644"
  when: "'k8s_control' in group_names"
  tags: [k8s_kubeadm_config]

- name: Point crictl at containerd (no endpoint warning, no --runtime-endpoint flag)
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (beamline-ansible, role k8s, Chapter 13).
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
  tags: [k8s_packages]

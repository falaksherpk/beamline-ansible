---
# A one-off fix (generate -> gate -> apply, in this order), run with netplan-dedup.yml, not part of
# site.yml. The steps are a sequence, not handlers (no-handler is waived for each). The Ch40 lint
# changes here are mechanical (FQCNs, explicit changed_when) and were not re-run live.
- name: Disable cloud-init network management (prevents 50- regeneration)
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    owner: root
    group: root
    mode: '0644'

- name: Remove cloud-init's conflicting default netplan file
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  register: removed_default

- name: Regenerate networkd config from the remaining netplan  # noqa: no-handler
  ansible.builtin.command: netplan generate
  changed_when: true  # runs only when the default file was removed
  when: removed_default.changed

- name: SAFETY GATE - check no phantom enp1s0 profile remains in /run  # noqa: no-handler
  ansible.builtin.find:
    paths: /run/systemd/network/
    patterns: '*enp1s0*'
  register: phantom
  when: removed_default.changed

- name: Abort before apply if the phantom profile survived  # noqa: no-handler
  ansible.builtin.assert:
    that: phantom.matched == 0
    fail_msg: "enp1s0 profile still in /run - NOT applying. Investigate manually."
    success_msg: "Clean: no enp1s0 profile. Safe to apply."
  when: removed_default.changed

- name: Apply netplan (only after the gate passed)  # noqa: no-handler
  ansible.builtin.command: netplan apply
  changed_when: true  # runs only when the default file was removed
  when: removed_default.changed

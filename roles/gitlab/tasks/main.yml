---
- name: Allow HTTP through the firewall for GitLab
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  tags: [gitlab_firewall]

- name: Allow HTTPS through the firewall for GitLab
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  tags: [gitlab_firewall]

- name: Allow the container registry through the firewall
  community.general.ufw:
    rule: allow
    port: "5050"
    proto: tcp
  tags: [gitlab_firewall]

- name: Add the official GitLab Runner apt repository (idempotent)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh" | bash
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list
  tags: [gitlab_runner]

- name: Install gitlab-runner and its helper images, pinned to GitLab's version
  ansible.builtin.apt:
    name:
      - "gitlab-runner={{ gitlab_runner_version }}"
      - "gitlab-runner-helper-images={{ gitlab_runner_version }}"
    state: present
    update_cache: true
  tags: [gitlab_runner]

- name: Hold the runner packages at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - gitlab-runner
    - gitlab-runner-helper-images
  tags: [gitlab_runner]

- name: Install Docker and BuildKit's buildx (container engine for the runner's docker executor)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-buildx
    state: present
    update_cache: true
  tags: [gitlab_docker]

- name: Ensure Docker is running and enabled
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  tags: [gitlab_docker]

- name: Trust the lab CA for GitLab's own outbound HTTPS (webhooks; Chapter 14)
  # GitLab's embedded OpenSSL ignores the system store that `common` fills;
  # Omnibus reads extra CAs from /etc/gitlab/trusted-certs on reconfigure.
  # Copied from the system store (single source: roles/common/files/beamline-ca.crt).
  # Changing it makes reconfigure restart Puma and Workhorse: ~1 min without the web UI, API and Git over SSH.
  ansible.builtin.copy:
    src: /usr/local/share/ca-certificates/beamline-ca.crt
    remote_src: true
    dest: /etc/gitlab/trusted-certs/beamline-ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: Reconfigure GitLab
  tags: [gitlab_trusted_certs]

- name: Allow Workhorse metrics only from the Prometheus host
  community.general.ufw:
    rule: allow
    port: "{{ gitlab_workhorse_metrics_port }}"
    proto: tcp
    from_ip: "{{ gitlab_metrics_scraper_ip }}"
    comment: "gitlab-workhorse metrics, scraped from obs (Ch16)"
  tags: [gitlab_firewall, gitlab_config]

- name: Allow Gitaly metrics only from the Prometheus host
  community.general.ufw:
    rule: allow
    port: "{{ gitlab_gitaly_metrics_port }}"
    proto: tcp
    from_ip: "{{ gitlab_metrics_scraper_ip }}"
    comment: "gitaly metrics, scraped from obs (Ch16)"
  tags: [gitlab_firewall, gitlab_config]

- name: Create the systemd drop-in directory for gitlab-runsvdir
  ansible.builtin.file:
    path: /etc/systemd/system/gitlab-runsvdir.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [gitlab_config]

- name: Start GitLab's services only once the network is up (Workhorse and Gitaly bind to the lab address)
  ansible.builtin.copy:
    src: gitlab-runsvdir-network-online.conf
    dest: /etc/systemd/system/gitlab-runsvdir.service.d/network-online.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [gitlab_config]

- name: Install gitlab.rb from Git (Ruby syntax checked before it is put in place)
  # reconfigure restarts the services whose configuration changed (Ch14: Puma and
  # Workhorse for trusted certs, ~1 min without the web UI, API and Git over SSH).
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
    validate: /opt/gitlab/embedded/bin/ruby -c %s
  notify: Reconfigure GitLab
  tags: [gitlab_config]

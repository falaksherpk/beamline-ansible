---
# defaults file for gitlab

# Must match GitLab's own version (GitLab CE 19.4.1, Part 2 Ch10).
# gitlab-runner and gitlab-runner-helper-images must be installed at exactly
# the same version (a hard package dependency since runner 17.7).
gitlab_runner_version: "19.4.1-1"

# Metrics for Prometheus on obs.beamline (Ch16): Rails through nginx on 443
# (monitoring_whitelist), Workhorse and Gitaly on the lab address; scraped only
# by the first host of the inventory group observability.
gitlab_metrics_scraper_ip: "{{ hostvars[groups['observability'][0]]['ansible_host'] }}"
gitlab_workhorse_metrics_port: 9229
gitlab_gitaly_metrics_port: 9236
